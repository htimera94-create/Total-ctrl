<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AntiGaspiPro – Réduire le gaspillage en restauration</title>
<style>
:root{--bg:#f2f5f0;--card:#fff;--ink:#1b2a22;--mute:#5d6b63;--line:#dde4dc;--g:#1f6f46;--g2:#e3f1e8;--am:#b7791f;--am2:#fcf1d9;--rd:#b42318;--rd2:#fde8e6;--bl:#175cd3;--bl2:#e4edfb;--r:10px}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2{margin:0 0 .5em;line-height:1.25;font-family:Georgia,"Times New Roman",serif}
h1{font-size:1.6rem}h2{font-size:1.2rem}
button,input,select{font:inherit}
:focus-visible{outline:3px solid var(--bl);outline-offset:2px}
.btn{border:1px solid var(--g);background:var(--g);color:#fff;padding:.5rem .9rem;border-radius:8px;cursor:pointer;font-weight:600}
.btn:hover{filter:brightness(1.1)}
.btn.sec{background:#fff;color:var(--g)}
.btn.danger{background:#fff;color:var(--rd);border-color:var(--rd)}
.btn.sm{padding:.25rem .6rem;font-size:.85rem}
.hidden{display:none!important}
.demo-bar{background:var(--am2);color:#6b4710;font-size:.85rem;padding:.4rem 1rem;text-align:center}
#login{min-height:calc(100vh - 34px);display:grid;grid-template-columns:1fr 1fr}
.l-left{background:var(--g);color:#fff;padding:3rem;display:flex;flex-direction:column;justify-content:center}
.l-left h1{font-size:2.6rem}
.l-left p{max-width:36ch;font-size:1.1rem;opacity:.92}
.l-right{display:flex;align-items:center;justify-content:center;padding:2rem}
.box{width:100%;max-width:410px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1.6rem}
label{display:block;font-weight:600;margin:.8rem 0 .25rem;font-size:.9rem}
input,select{width:100%;padding:.55rem .65rem;border:1px solid #c5cfc6;border-radius:8px;background:#fff}
.demo{background:var(--g2);border-radius:8px;padding:.7rem;font-size:.88rem;margin-top:1rem}
.demo button{display:block;width:100%;text-align:left;background:none;border:0;padding:.3rem 0;cursor:pointer;color:var(--g);font-weight:600}
.err{background:var(--rd2);color:var(--rd);padding:.55rem .7rem;border-radius:8px;margin-top:.8rem;font-size:.9rem}
#app{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 34px)}
aside{background:#14271d;color:#dfe9e2;padding:1rem;position:sticky;top:0;height:100vh}
aside .logo{font:700 1.2rem Georgia,serif;color:#fff;margin-bottom:1.2rem}
aside a{display:block;color:#cfe0d5;text-decoration:none;padding:.55rem .7rem;border-radius:8px;margin-bottom:2px}
aside a.on,aside a:hover{background:#24402f;color:#fff}
main{min-width:0}
header{display:flex;gap:.8rem;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line);padding:.7rem 1.2rem;flex-wrap:wrap}
.who{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.role{background:var(--g2);color:var(--g);border-radius:99px;padding:.15rem .7rem;font-weight:700;font-size:.82rem}
#burger{display:none}
#view{padding:1.2rem;max-width:1150px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.9rem;margin-bottom:1.2rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1rem}
.stat b{display:block;font:700 1.7rem Georgia,serif}
.stat span{color:var(--mute);font-size:.88rem}
.bar{display:flex;align-items:center;gap:.6rem;margin:.45rem 0;font-size:.9rem}
.bar i{display:block;height:12px;background:var(--g);border-radius:6px;min-width:3px}
.bar span:first-child{width:140px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evo{display:flex;align-items:flex-end;gap:.6rem;height:170px;padding-top:1.2rem}
.evo div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.78rem;color:var(--mute);text-align:center}
.evo i{display:block;width:100%;background:var(--g);border-radius:6px 6px 0 0;min-height:2px}
.evo i.now{background:var(--am)}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%}
th,td{padding:.6rem .75rem;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:#f7f9f6;font-size:.85rem;color:var(--mute)}
tr:last-child td{border-bottom:0}
.badge{display:inline-block;padding:.1rem .6rem;border-radius:99px;font-size:.8rem;font-weight:700}
.b-ok{background:var(--g2);color:var(--g)}.b-urg{background:var(--rd2);color:var(--rd)}.b-info{background:var(--bl2);color:var(--bl)}.b-fic{background:var(--am2);color:var(--am)}
.bar-top{display:flex;justify-content:space-between;align-items:center;gap:.6rem;margin-bottom:.9rem;flex-wrap:wrap}
.empty{text-align:center;padding:2rem 1rem;color:var(--mute)}
.note{background:var(--am2);color:#6b4710;border-radius:8px;padding:.6rem .8rem;font-size:.88rem;margin-bottom:1rem}
dialog{border:0;border-radius:var(--r);padding:1.3rem;width:min(560px,94vw);max-height:88vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.45)}
.acts{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1.1rem}
#toast{position:fixed;bottom:1rem;right:1rem;z-index:99;display:grid;gap:.4rem}
.t{background:var(--ink);color:#fff;padding:.6rem .9rem;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.t.e{background:var(--rd)}
@media(max-width:800px){
#login{grid-template-columns:1fr}.l-left{padding:1.6rem}.l-left h1{font-size:1.8rem}
#app{grid-template-columns:1fr}
aside{position:fixed;z-index:20;width:240px;left:-260px;transition:left .2s}
aside.open{left:0}
#burger{display:inline-block}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.fast{display:grid;gap:.4rem;max-width:520px}.cost{font:700 1.3rem Georgia,serif;color:var(--g);min-height:1.6rem}.big{width:100%;padding:.9rem;font-size:1.05rem;margin-top:.6rem}
#errbox{background:var(--rd2);color:var(--rd);padding:1rem;margin:1rem;border-radius:8px;white-space:pre-wrap}
.linkbtn{background:none;border:0;color:var(--g);text-decoration:underline;cursor:pointer;padding:0;font:inherit}
aside .linkbtn{color:#9fb8a8}
</style>
</head>
<body>
<div class="demo-bar" id="demobar"></div>

<section id="login">
  <div class="l-left">
    <h1>AntiGaspiPro</h1>
    <p>Enregistrez ce qui est jeté, comprenez pourquoi, et réduisez le gaspillage de votre restaurant ou fast-food.</p>
  </div>
  <div class="l-right">
    <form class="box" id="lform" autocomplete="off">
      <h2>Connexion</h2>
      <label for="em">Adresse e-mail</label>
      <input id="em" type="email" required placeholder="vous@exemple.fr">
      <label for="pw">Mot de passe</label>
      <input id="pw" type="password" required>
      <div id="lerr" class="err hidden" role="alert"></div>
      <button class="btn" style="width:100%;margin-top:1rem">Se connecter</button>
      <div class="demo">
        <b>Comptes de démonstration (fictifs)</b> – mot de passe commun : <code>demo123</code>
        <button type="button" data-u="admin@antigaspipro.fr">Administrateur de la plateforme</button>
        <button type="button" data-u="responsable@antigaspipro.fr">Responsable de restaurant</button>
        <button type="button" data-u="employe@antigaspipro.fr">Employé</button>
      </div>
      <p style="text-align:center;margin:1rem 0 .4rem"><button type="button" class="linkbtn" id="reqopen">Demander un accès pour mon restaurant</button></p>
      <p style="text-align:center;font-size:.8rem;color:var(--mute);margin:0"><button type="button" class="linkbtn" data-legal="mentions">Mentions légales</button> · <button type="button" class="linkbtn" data-legal="privacy">Confidentialité</button> · <button type="button" class="linkbtn" data-legal="cgu">Conditions</button></p>
    </form>
  </div>
</section>

<div id="app" class="hidden">
  <aside id="side"><div class="logo">AntiGaspiPro</div><nav id="nav"></nav><div style="margin-top:1.2rem;font-size:.78rem"><button type="button" class="linkbtn" data-legal="mentions">Mentions légales</button><br><button type="button" class="linkbtn" data-legal="privacy">Confidentialité</button> · <button type="button" class="linkbtn" data-legal="cgu">Conditions</button></div></aside>
  <main>
    <header>
      <div class="who"><button id="burger" class="btn sec sm" aria-label="Ouvrir le menu">☰ Menu</button><strong id="uname"></strong><span class="role" id="urole"></span><span id="urest" style="color:var(--mute)"></span></div>
      <button class="btn sec sm" id="logout">Se déconnecter</button>
    </header>
    <div id="view"></div>
  </main>
</div>

<dialog id="dlg"><form method="dialog" id="dform"></form></dialog>
<div id="toast" aria-live="polite"></div>

<div id="errbox" class="hidden" role="alert"></div>
<script>
"use strict";
window.onerror=(m,s,l)=>{const b=document.getElementById("errbox");b.classList.remove("hidden");b.textContent="Erreur détectée : "+m+" (ligne "+l+")"};
/* ========= Configuration Supabase (non connecté) =========
   Pour la suite : renseigner l'URL du projet et la clé « anon » (publique).
   N'écrivez JAMAIS la clé « service_role » ni un mot de passe ici : ce fichier est public.
   Le schéma de base de données est fourni dans supabase-schema.sql. */
const CFG={supabaseUrl:"",supabaseAnonKey:""};
const DEMO=!CFG.supabaseUrl;
document.getElementById("demobar").textContent=DEMO
 ?"Mode démonstration : toutes les données sont fictives et stockées uniquement dans ce navigateur. Supabase n'est pas connecté."
 :"Supabase configuré (non vérifié).";

/* ========= Données ========= */
const KEY="antigaspipro_db_v5", SKEY="antigaspipro_session_v5", PASS="demo123";
const ROLES={admin:"Administrateur",responsable:"Responsable de restaurant",employe:"Employé"};
const REASONS=["Invendu en fin de service","Date dépassée","Surproduction","Erreur de préparation","Produit abîmé","Retour client","Restes d'assiette","Chaîne du froid rompue"];
const UNITS=["kg","L","pièce","portion"];
const UN={"pièce":{fam:"n",f:1},portion:{fam:"n",f:1},g:{fam:"m",f:.001},kg:{fam:"m",f:1},mL:{fam:"v",f:.001},L:{fam:"v",f:1}};
const FAM={kg:"m",L:"v","pièce":"n",portion:"n"};
const PRE={"pièce":[1,2,3,4,5,6,8,10,12,15,20,25,30,40,50],portion:[1,2,3,4,5,6,8,10,12,15,20,25,30,40,50],g:[50,100,200,250,500,1000,2000,5000],kg:[.5,1,2,3,5,10],mL:[100,250,500,1000,2000],L:[.5,1,2,5,10]};
const DATES=[["0","Aujourd'hui"],["1","Hier"],["2","Avant-hier"],["3","Il y a 3 jours"],["7","Il y a 7 jours"]];
const FAMU={m:["g","kg"],v:["mL","L"],n:["pièce","portion"],all:["pièce","portion","g","kg","mL","L"]};
const DEF={m:"g",v:"mL",n:"pièce",all:"pièce"};
const BASEU={m:"kg",v:"L",n:"pièce"};
/* Produits types de fast-food (import optionnel dans le catalogue) : coûts d'achat FICTIFS par kg, L ou pièce */
const FASTFOOD=[["Burger classique","n",1.8,"Plats préparés"],["Cheeseburger","n",1.6,"Plats préparés"],["Double burger","n",2.6,"Plats préparés"],["Burger poulet","n",1.9,"Plats préparés"],["Steak haché","m",11,"Viandes"],["Filet de poulet pané","m",8.5,"Viandes"],["Nuggets","m",7.5,"Viandes"],["Frites","m",2.2,"Épicerie"],["Pain burger","n",.35,"Boulangerie"],["Fromage en tranche","m",8,"Produits laitiers"],["Salade","m",4,"Fruits et légumes"],["Tomates","m",3.2,"Fruits et légumes"],["Oignons","m",1.5,"Fruits et légumes"],["Bacon","m",9,"Viandes"],["Sauce (ketchup, mayo…)","v",5,"Sauces et boissons"],["Boisson gazeuse","v",1.5,"Sauces et boissons"],["Milkshake","v",4,"Sauces et boissons"],["Glace","v",5,"Plats préparés"],["Café","v",3,"Sauces et boissons"],["Wrap","n",1.2,"Plats préparés"],["Sandwich","n",2,"Plats préparés"],["Kebab (viande)","m",9,"Viandes"],["Pizza","n",3,"Plats préparés"],["Cookie ou dessert","n",.9,"Boulangerie"]];
const CATS=["Viandes","Poissons","Produits laitiers","Fruits et légumes","Épicerie","Boulangerie","Sauces et boissons","Plats préparés","Autre"];
const NAV={
 admin:[["accueil","Vue d'ensemble"],["restaurants","Restaurants inscrits"],["demandes","Demandes d'accès"],["gaspillages","Gaspillages"],["rapports","Rapports"]],
 responsable:[["accueil","Tableau de bord"],["gaspillages","Gaspillages"],["catalogue","Catalogue produits"],["achats","Achats et factures"],["restaurant","Mon restaurant"]],
 employe:[["saisie","Enregistrer un gaspillage"],["catalogue","Catalogue du restaurant"],["mesgaspillages","Mes saisies"]]
};
const day=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function seed(){
 let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
 const R=[{id:"r1",name:"Burger du Centre",type:"Fast-food",city:"Paris",status:"Actif"},
  {id:"r2",name:"Le Petit Bistrot",type:"Restaurant",city:"Bobigny",status:"Actif"},
  {id:"r3",name:"Pizza Express",type:"Fast-food",city:"Montreuil",status:"Suspendu"}];
 const U=[["admin@antigaspipro.fr","Admin Plateforme","admin",""],["responsable@antigaspipro.fr","Karim Responsable","responsable","r1"],
  ["employe@antigaspipro.fr","Léa Employée","employe","r1"],["resp.bistrot@antigaspipro.fr","Sophie Martin","responsable","r2"],
  ["employe.bistrot@antigaspipro.fr","Tom Lefèvre","employe","r2"],["resp.pizza@antigaspipro.fr","Marco Rossi","responsable","r3"]]
  .map(([email,name,role,restaurant])=>({email,name,role,restaurant}));
 const P=[["r1","Steak haché","Viandes","kg",11,18,2],["r1","Pain burger","Boulangerie","pièce",.65,40,1],["r1","Frites surgelées","Épicerie","kg",2.2,25,30],
  ["r1","Fromage en tranche","Produits laitiers","kg",8,6,9],["r1","Salade","Fruits et légumes","kg",4,4,0],["r1","Sauce maison","Sauces et boissons","L",5,8,20],
  ["r1","Nuggets","Viandes","kg",7.5,10,3],["r1","Boisson gazeuse","Sauces et boissons","L",1.5,30,120],["r1","Salade composée","Plats préparés","portion",3.2,12,0],
  ["r2","Poulet fermier","Viandes","kg",9.5,12,1],["r2","Saumon frais","Poissons","kg",24,6,-1],["r2","Tomates","Fruits et légumes","kg",3.2,15,2],
  ["r2","Riz basmati","Épicerie","kg",2.4,25,200],["r2","Crème fraîche","Produits laitiers","L",4.8,8,6],["r2","Salade verte","Fruits et légumes","pièce",1.1,10,0]]
  .map(([restaurant,name,cat,unit,price,qty,e])=>({id:uid(),restaurant,name,cat,unit,price,qty,expiry:day(e)}));
 const W=[];
 for(let i=0;i<50;i++){
  const r=rnd()<.6?"r1":"r2",pl=P.filter(p=>p.restaurant===r),p=pl[Math.floor(rnd()*pl.length)];
  const n=p.unit==="pièce"||p.unit==="portion",qty=n?Math.round(2+rnd()*14):Math.round((.5+rnd()*4)*2)/2;
  W.push({id:uid(),restaurant:r,product:p.name,unit:p.unit,qty,cost:+(qty*p.price).toFixed(2),
   reason:REASONS[Math.floor(rnd()*REASONS.length)],date:day(-Math.floor(rnd()*45)),by:r==="r1"?"employe@antigaspipro.fr":"employe.bistrot@antigaspipro.fr"});
 }
 const A=[["Steak haché",10,"kg",110,11],["Pain burger",200,"pièce",130,.65]].map(([product,qty,unit,total,unitPrice],i)=>({id:uid(),restaurant:"r1",date:day(-5-i),supplier:"Grossiste Démo (fictif)",product,qty,unit,total,unitPrice,baseUnit:unit}));
 return{restaurants:R,users:U,products:P,wastes:W,purchases:A,requests:[{id:uid(),date:day(-1),name:"Kebab Délice",type:"Fast-food",city:"Bobigny",contact:"Yassine Amrani",email:"contact@kebab-delice.example",phone:"",status:"En attente",consent:true,consentAt:new Date().toISOString(),consentVersion:"2026-10"}]};
}
/* Couche de stockage : c'est la seule partie à remplacer par Supabase plus tard. */
let db;
function load(){try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){db=null}if(!db||!db.users){db=seed();save()}db.purchases=db.purchases||[];db.requests=db.requests||[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast("Enregistrement impossible dans ce navigateur.",1)}}

/* ========= Utilitaires ========= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur=n=>Number(n||0).toLocaleString("fr-FR",{style:"currency",currency:"EUR"});
const pfmt=x=>Number(x).toLocaleString("fr-FR",{style:"currency",currency:"EUR",minimumFractionDigits:2,maximumFractionDigits:4});
const stk=p=>typeof p.qty==="number"?num(p.qty)+" "+p.unit:"–";
const expBadge=d=>{if(!d)return"–";const n=-ago(d);return fdate(d)+" "+(n<0?'<span class="badge b-urg">Périmé</span>':n<=2?`<span class="badge b-urg">Urgent (${n===0?"aujourd'hui":n+" j"})</span>`:n<=5?`<span class="badge b-fic">Bientôt (${n} j)</span>`:'<span class="badge b-ok">OK</span>')};
const num=n=>Number(n||0).toLocaleString("fr-FR",{maximumFractionDigits:2});
const fdate=d=>d?new Date(d+"T00:00").toLocaleDateString("fr-FR"):"";
const ago=d=>Math.round((new Date(new Date().toISOString().slice(0,10)+"T00:00")-new Date(d+"T00:00"))/864e5);
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const group=(a,kf,vf)=>a.reduce((m,x)=>(m[kf(x)]=(m[kf(x)]||0)+vf(x),m),{});
const rest=id=>db.restaurants.find(r=>r.id===id)||{name:"(supprimé)"};
const uname=e=>(db.users.find(u=>u.email===e)||{}).name||e;
const mineW=()=>db.wastes.filter(w=>w.restaurant===me.restaurant);
const last30=a=>a.filter(w=>ago(w.date)<30);
function toast(m,err){const t=document.createElement("div");t.className="t"+(err?" e":"");t.textContent=m;$("#toast").append(t);setTimeout(()=>t.remove(),3200)}
let me=null;

/* ========= Fenêtres ========= */
function openForm(title,fields,vals,onSave){
 const f=$("#dform");
 f.innerHTML=`<h2>${esc(title)}</h2>`+fields.map(x=>{
  const v=vals[x.k]??"";
  const inp=x.opts?`<select id="f_${x.k}">${x.opts.map(o=>`<option ${String(o)===String(v)?"selected":""}>${esc(o)}</option>`).join("")}</select>`
   :`<input id="f_${x.k}" type="${x.t||"text"}" ${x.t==="number"?'step="any" min="0"':""} ${x.max?`max="${x.max}"`:""} value="${esc(v)}" ${x.opt?"":"required"}>`;
  return`<label for="f_${x.k}">${esc(x.l)}</label>${inp}`}).join("")+
  `<div class="acts"><button type="button" class="btn sec" id="fc">Annuler</button><button class="btn">Enregistrer</button></div>`;
 $("#fc").onclick=()=>$("#dlg").close();
 f.onsubmit=e=>{e.preventDefault();const o={};
  for(const x of fields){let v=$("#f_"+x.k).value.trim();if(x.t==="number"&&!(x.opt&&v===""))v=parseFloat(v);o[x.k]=v}
  for(const x of fields)if(x.t==="number"&&o[x.k]!==""&&(isNaN(o[x.k])||o[x.k]<0||(x.pos&&o[x.k]===0))){toast(`« ${x.l} » doit être un nombre ${x.pos?"supérieur à 0":"positif"}.`,1);return}
  onSave(o);$("#dlg").close()};
 $("#dlg").showModal();
}
function confirmBox(title,msg,label,fn){
 const f=$("#dform");f.onsubmit=e=>e.preventDefault();
 f.innerHTML=`<h2>${esc(title)}</h2><p>${esc(msg)}</p><div class="acts"><button type="button" class="btn sec" id="fc">Annuler</button><button type="button" class="btn danger" id="fy">${esc(label)}</button></div>`;
 $("#fc").onclick=()=>$("#dlg").close();$("#fy").onclick=()=>{fn();$("#dlg").close()};$("#dlg").showModal();
}

/* ========= Connexion (démonstration uniquement) ========= */
function login(email,pw){
 const u=db.users.find(x=>x.email===email.toLowerCase().trim());
 if(!u)return"Aucun compte ne correspond à cette adresse. Utilisez l'un des comptes de démonstration.";
 if(pw!==PASS)return"Mot de passe incorrect. Le mot de passe de démonstration est affiché sous le formulaire.";
 if(u.role!=="admin"&&rest(u.restaurant).status==="Suspendu")return"Ce restaurant est suspendu par l'administrateur de la plateforme.";
 localStorage.setItem(SKEY,u.email);return null}
$("#lform").onsubmit=e=>{e.preventDefault();const r=login($("#em").value,$("#pw").value);
 if(r){$("#lerr").textContent=r;$("#lerr").classList.remove("hidden")}else{location.hash="";boot()}};
document.querySelectorAll(".demo button").forEach(b=>b.onclick=()=>{$("#em").value=b.dataset.u;$("#pw").value=PASS;$("#lform").requestSubmit()});
$("#logout").onclick=()=>{localStorage.removeItem(SKEY);me=null;location.hash="";boot();toast("Vous êtes déconnecté.")};
$("#burger").onclick=()=>$("#side").classList.toggle("open");

function boot(){
 load();
 me=db.users.find(u=>u.email===localStorage.getItem(SKEY))||null;
 $("#login").classList.toggle("hidden",!!me);$("#app").classList.toggle("hidden",!me);
 if(!me)return;
 $("#uname").textContent=me.name;$("#urole").textContent=ROLES[me.role];
 $("#urest").textContent=me.role==="admin"?"":rest(me.restaurant).name;
 $("#nav").innerHTML=NAV[me.role].map(([p,l])=>`<a href="#/${p}" data-p="${p}">${l}</a>`).join("")+
  `<a href="#" id="reset" style="margin-top:1.2rem;color:#f0b4ab">Réinitialiser les données</a>`;
 $("#reset").onclick=ev=>{ev.preventDefault();confirmBox("Réinitialiser les données","Toutes vos modifications seront remplacées par les données de démonstration d'origine.","Réinitialiser",()=>{db=seed();save();route();toast("Données de démonstration réinitialisées.")})};
 route();
}

/* ========= Routage avec contrôle de rôle (démonstration, côté navigateur) ========= */
const PAGES={admin:{},responsable:{},employe:{}},WIRE={};
function route(){
 if(!me)return;
 let p=location.hash.replace("#/","");
 const allowed=NAV[me.role].map(x=>x[0]);
 if(!allowed.includes(p)){p=allowed[0];history.replaceState(null,"","#/"+p)}
 document.querySelectorAll("#nav a[data-p]").forEach(a=>a.classList.toggle("on",a.dataset.p===p));
 $("#side").classList.remove("open");
 $("#view").innerHTML=PAGES[me.role][p]();
 const w=WIRE[me.role+"."+p];if(w)w();
}
window.addEventListener("hashchange",route);

/* ========= Éléments communs ========= */
const stat=(v,l)=>`<div class="card stat"><b>${v}</b><span>${l}</span></div>`;
const empty=t=>`<div class="card empty">${t}</div>`;
function bars(map,fmt){const e=Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,7);if(!e.length)return'<div class="empty">Aucune donnée pour le moment.</div>';
 const m=e[0][1]||1;return e.map(([k,v])=>`<div class="bar"><span title="${esc(k)}">${esc(k)}</span><i style="width:${Math.max(3,v/m*55)}%"></i><span>${(fmt||eur)(v)}</span></div>`).join("")}
function evo(W){const b=[0,0,0,0,0,0];W.forEach(w=>{const k=Math.floor(ago(w.date)/7);if(k>=0&&k<6)b[k]+=w.cost});
 const m=Math.max(...b,1);
 return`<div class="evo">`+[5,4,3,2,1,0].map(k=>`<div><span>${b[k]?eur(b[k]):""}</span><i class="${k?"":"now"}" style="height:${b[k]/m*100*.8}%"></i>${k?`il y a ${k} sem.`:"cette sem."}</div>`).join("")+`</div>`}
function variation(W){const c=sum(W.filter(w=>ago(w.date)<7),w=>w.cost),p=sum(W.filter(w=>ago(w.date)>=7&&ago(w.date)<14),w=>w.cost);
 if(!p)return c?"nouveau":"–";const v=(c-p)/p*100;return(v>0?"+":"")+num(v)+" %"}
const baseQty=(W,fam)=>sum(W.filter(w=>(UN[w.unit]||{}).fam===fam),w=>w.qty*UN[w.unit].f);
const qtyStats=W=>stat(num(baseQty(W,"m"))+" kg","d'aliments solides jetés (30 jours)")+stat(num(baseQty(W,"v"))+" L","de liquides jetés (30 jours)")+stat(num(baseQty(W,"n"))+" pièces","ou portions jetées (30 jours)");
function wasteTable(list,opts={}){
 if(!list.length)return empty("Aucun gaspillage enregistré. Utilisez « Enregistrer un gaspillage » dès qu'un produit est jeté.");
 return`<div class="tw"><table><thead><tr><th>Date</th>${opts.rest?"<th>Restaurant</th>":""}<th>Produit</th><th>Quantité</th><th>Raison</th><th>Coût estimé</th><th>Saisi par</th>${opts.del?"<th>Action</th>":""}</tr></thead><tbody>`+
 list.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(w=>`<tr><td>${fdate(w.date)}</td>${opts.rest?`<td>${esc(rest(w.restaurant).name)}</td>`:""}<td><b>${esc(w.product)}</b></td><td>${num(w.qty)} ${esc(w.unit)}</td><td>${esc(w.reason)}</td><td>${eur(w.cost)}</td><td>${esc(uname(w.by))}</td>${opts.del?`<td><button class="btn danger sm" data-delw="${w.id}">Supprimer</button></td>`:""}</tr>`).join("")+"</tbody></table></div>"}
function mountWasteForm(f,modal){
 const P=db.products.filter(p=>p.restaurant===me.restaurant);
 if(!P.length){f.innerHTML=`<p>Le catalogue de votre restaurant est vide. ${me.role==="employe"?"Demandez à votre responsable d'ajouter des produits.":"Ajoutez des produits ou enregistrez un achat avant de saisir un gaspillage."}</p>`;return}
 const L=(a,fn)=>a.map(fn).join("");
 f.innerHTML=(modal?"<h2>Enregistrer un gaspillage</h2>":"")+
 `<label for="fp">1. Produit jeté</label><select id="fp">${L(P,p=>`<option value="${esc(p.id)}">${esc(p.name)} – ${pfmt(p.price)} / ${esc(p.unit)}</option>`)}</select>
 <label for="fu">2. Unité</label><select id="fu"></select>
 <label for="fq">3. Quantité jetée</label><select id="fq"></select>
 <div id="fql" class="hidden"><label for="fqv">Quantité exacte</label><input id="fqv" type="number" min="0" step="any" inputmode="decimal" placeholder="Exemple : 7 ou 1,5"></div>
 <label for="fr">4. Raison du gaspillage</label><select id="fr">${L(REASONS,r=>`<option>${esc(r)}</option>`)}</select>
 <label for="fd">5. Date</label><select id="fd">${L(DATES,d=>`<option value="${d[0]}">${d[1]}</option>`)}<option value="x">Choisir une date…</option></select>
 <div id="fdl" class="hidden"><input id="fdv" type="date" max="${day(0)}" value="${day(0)}" aria-label="Date"></div>
 <small id="fpr" style="color:var(--mute)"></small><div class="cost" id="fc2"></div>
 <button class="btn big">Enregistrer le gaspillage</button>${modal?'<button type="button" class="btn sec big" id="fc">Annuler</button>':""}`;
 const cur=()=>P.find(x=>x.id===$("#fp").value),price=()=>cur().price*UN[$("#fu").value].f;
 const qty=()=>$("#fq").value==="x"?parseFloat($("#fqv").value):parseFloat($("#fq").value);
 function calc(){const q=qty();$("#fpr").textContent="Prix unitaire : "+pfmt(price())+" / "+$("#fu").value;$("#fc2").textContent=q>0?"Coût estimé : "+eur(q*price()):""}
 function zone(){$("#fql").classList.toggle("hidden",$("#fq").value!=="x")}
 function presets(){$("#fq").innerHTML=L(PRE[$("#fu").value],q=>`<option value="${q}">${num(q)}</option>`)+'<option value="x">Autre quantité (saisie libre)</option>';zone();calc()}
 function units(){const p=cur(),fam=FAM[p.unit]||"n";$("#fu").innerHTML=L(FAMU[fam],u=>`<option ${u===p.unit?"selected":""}>${u}</option>`);presets()}
 $("#fp").onchange=units;$("#fu").onchange=presets;$("#fq").onchange=()=>{zone();calc()};$("#fqv").oninput=calc;
 $("#fd").onchange=()=>$("#fdl").classList.toggle("hidden",$("#fd").value!=="x");
 if(modal)$("#fc").onclick=()=>$("#dlg").close();
 f.onsubmit=e=>{e.preventDefault();
  const p=cur(),q=qty(),u=$("#fu").value,d=$("#fd").value==="x"?$("#fdv").value:day(-Number($("#fd").value));
  if(!(q>0)){toast("Indiquez une quantité supérieure à 0.",1);return}
  if(!d||d>day(0)){toast("La date ne peut pas être dans le futur.",1);return}
  db.wastes.push({id:uid(),restaurant:me.restaurant,product:p.name,unit:u,qty:q,cost:+(q*price()).toFixed(2),reason:$("#fr").value,date:d,by:me.email});
  if(typeof p.qty==="number")p.qty=Math.max(0,+(p.qty-q*UN[u].f/UN[p.unit].f).toFixed(3));
  save();if(modal)$("#dlg").close();route();toast(`Gaspillage enregistré : ${num(q)} ${u} de ${p.name}.`)};
 units();
}
function addWaste(){
 if(!db.products.some(p=>p.restaurant===me.restaurant)){toast("Le catalogue est vide : ajoutez des produits ou enregistrez un achat avant de saisir un gaspillage.",1);return}
 mountWasteForm($("#dform"),true);$("#dlg").showModal()}
function wireDelW(){document.querySelectorAll("[data-delw]").forEach(b=>b.onclick=()=>confirmBox("Supprimer cette saisie","Cette ligne sera retirée des statistiques et la quantité remise en stock.","Supprimer",()=>{const w0=db.wastes.find(w=>w.id===b.dataset.delw),pp=w0&&db.products.find(x=>x.restaurant===w0.restaurant&&x.name===w0.product);if(pp&&typeof pp.qty==="number")pp.qty=+(pp.qty+w0.qty*UN[w0.unit].f/UN[pp.unit].f).toFixed(3);db.wastes=db.wastes.filter(w=>w.id!==b.dataset.delw);save();route();toast("Saisie supprimée.")}))}

/* ========= Administrateur ========= */
const prev30=a=>a.filter(w=>ago(w.date)>=30&&ago(w.date)<60);
const eco=W=>{const c=sum(last30(W),w=>w.cost),p=sum(prev30(W),w=>w.cost);return p>0?{v:Math.max(0,p-c),sub:c>p?"coût en hausse de "+eur(c-p):"par rapport aux 30 jours précédents"}:{v:null,sub:"pas encore de période de comparaison"}};
const ecoStat=W=>{const e=eco(W);return stat(e.v===null?"–":eur(e.v),`économie réalisée sur 30 jours<br><small>${e.sub}</small>`)};
const potStat=c=>stat(eur(c*.2),"économies potentielles estimées<br><small>hypothèse : −20 % de gaspillage</small>");
const volTxt=W=>[num(baseQty(W,"m"))+" kg",num(baseQty(W,"v"))+" L",num(baseQty(W,"n"))+" pièces"].join(" · ");
PAGES.admin.accueil=()=>{const W=db.wastes,W30=last30(W),R=db.restaurants,c=sum(W30,w=>w.cost);
 return`<h1>Vue d'ensemble de la plateforme</h1><div class="note">Données entièrement fictives (démonstration). Les économies potentielles reposent sur une hypothèse de −20 %. L'économie réalisée compare les 30 derniers jours aux 30 jours précédents.</div>
 <div class="grid">${stat(R.length,"restaurants inscrits")}${stat(R.filter(r=>r.status==="Actif").length,"restaurants actifs")}${stat(db.requests.filter(q=>q.status==="En attente").length,"demandes d'accès en attente")}${stat(eur(c),"coût du gaspillage (30 jours)")}${stat(W30.length,"saisies (30 jours)")}${potStat(c)}${ecoStat(W)}</div>
 <div class="card"><h2>Évolution du coût du gaspillage (toute la plateforme)</h2>${evo(W)}</div><br>
 <div class="card"><h2>Détail par restaurant (30 jours)</h2><div class="tw"><table><thead><tr><th>Restaurant</th><th>Statut</th><th>Volume gaspillé</th><th>Coût</th><th>Économies potentielles</th><th>Économie réalisée</th></tr></thead><tbody>`+
 R.map(r=>{const w=W.filter(x=>x.restaurant===r.id),w30=last30(w),cc=sum(w30,x=>x.cost),e=eco(w);
  return`<tr><td><b>${esc(r.name)}</b></td><td><span class="badge ${r.status==="Actif"?"b-ok":"b-urg"}">${esc(r.status)}</span></td><td>${volTxt(w30)}</td><td>${eur(cc)}</td><td>${eur(cc*.2)}</td><td>${e.v===null?"–":eur(e.v)}</td></tr>`}).join("")+`</tbody></table></div></div>`};
PAGES.admin.gaspillages=()=>`<h1>Gaspillages de la plateforme</h1>`+wasteTable(db.wastes,{rest:1,del:1});
WIRE["admin.gaspillages"]=()=>wireDelW();
PAGES.admin.rapports=()=>{const W30=last30(db.wastes),c=sum(W30,w=>w.cost);
 return`<h1>Rapports de la plateforme</h1><div class="grid">${stat(eur(c),"coût total (30 jours)")}${stat(W30.length,"saisies (30 jours)")}${potStat(c)}${ecoStat(db.wastes)}</div>
 <div class="card"><h2>Coût par restaurant</h2>${bars(group(W30,w=>rest(w.restaurant).name,w=>w.cost))}</div><br>
 <div class="card"><h2>Coût par raison</h2>${bars(group(W30,w=>w.reason,w=>w.cost))}</div><br>
 <div class="card"><h2>Produits les plus gaspillés</h2>${bars(group(W30,w=>w.product,w=>w.cost))}</div>`};
const restFields=[{k:"name",l:"Nom de l'établissement"},{k:"type",l:"Type",opts:["Restaurant","Fast-food"]},{k:"city",l:"Ville"}];
PAGES.admin.restaurants=()=>`<div class="bar-top"><h1>Restaurants inscrits</h1><button class="btn" id="addr">Ajouter un restaurant</button></div>
 <div class="tw"><table><thead><tr><th>Établissement</th><th>Type</th><th>Ville</th><th>Responsable</th><th>Statut</th><th>Coût 30 j</th><th>Actions</th></tr></thead><tbody>`+
 db.restaurants.map(r=>{const m=db.users.find(u=>u.restaurant===r.id&&u.role==="responsable");
  return`<tr><td><b>${esc(r.name)}</b></td><td>${esc(r.type)}</td><td>${esc(r.city)}</td><td>${m?esc(m.name):"–"}</td><td><span class="badge ${r.status==="Actif"?"b-ok":"b-urg"}">${r.status}</span></td><td>${eur(sum(last30(db.wastes.filter(w=>w.restaurant===r.id)),w=>w.cost))}</td>
  <td><button class="btn sec sm" data-edit="${r.id}">Modifier</button> <button class="btn sec sm" data-tog="${r.id}">${r.status==="Actif"?"Suspendre":"Réactiver"}</button> <button class="btn danger sm" data-del="${r.id}">Supprimer</button></td></tr>`}).join("")+`</tbody></table></div>`;
WIRE["admin.restaurants"]=()=>{
 $("#addr").onclick=()=>openForm("Ajouter un restaurant",[...restFields,{k:"mname",l:"Nom du responsable"},{k:"memail",l:"E-mail du responsable",t:"email"}],{type:"Restaurant"},o=>{
  const email=o.memail.toLowerCase();if(db.users.some(u=>u.email===email)){toast("Cette adresse e-mail existe déjà.",1);return}
  const id="r"+uid();db.restaurants.push({id,name:o.name,type:o.type,city:o.city,status:"Actif"});
  db.users.push({email,name:o.mname,role:"responsable",restaurant:id});save();route();toast("Restaurant ajouté (démonstration : aucun e-mail envoyé).")});
 document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{const r=db.restaurants.find(x=>x.id===b.dataset.edit);
  openForm("Modifier le restaurant",restFields,r,o=>{Object.assign(r,o);save();route();toast("Restaurant modifié.")})});
 document.querySelectorAll("[data-tog]").forEach(b=>b.onclick=()=>{const r=db.restaurants.find(x=>x.id===b.dataset.tog);
  r.status=r.status==="Actif"?"Suspendu":"Actif";save();route();toast(`${r.name} : ${r.status==="Actif"?"réactivé":"suspendu"}.`)});
 document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>confirmBox("Supprimer ce restaurant","Son catalogue, son équipe et tous ses gaspillages seront aussi supprimés.","Supprimer",()=>{
  const id=b.dataset.del;db.restaurants=db.restaurants.filter(r=>r.id!==id);db.products=db.products.filter(p=>p.restaurant!==id);
  db.wastes=db.wastes.filter(w=>w.restaurant!==id);db.purchases=db.purchases.filter(a=>a.restaurant!==id);db.users=db.users.filter(u=>u.restaurant!==id);save();route();toast("Restaurant supprimé.")}))};

 const watch=db.products.filter(p=>p.restaurant===me.restaurant&&p.expiry&&-ago(p.expiry)<=5).sort((a,b)=>a.expiry.localeCompare(b.expiry));
 return`<h1>Tableau de bord – ${esc(rest(me.restaurant).name)}</h1><div class="note">Données de démonstration fictives. L'économie réalisée compare les 30 derniers jours aux 30 jours précédents.</div>
 <div class="grid">${stat(eur(c),"coût estimé du gaspillage (30 jours)")}${qtyStats(W30)}${stat(v,"évolution du coût, 7 derniers jours")}${stat(watch.length,"produits à écouler sous 5 jours")}${potStat(c)}${ecoStat(W)}</div>
 <div class="card"><h2>Actions rapides</h2><button class="btn" id="addw">Enregistrer un gaspillage</button> <button class="btn sec" id="goachats">Achats et factures</button> <button class="btn sec" id="gocat">Gérer le catalogue</button></div><br>

 <div class="card"><h2>Évolution hebdomadaire du coût</h2>${evo(W)}</div><br>
 <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="card"><h2>Coût par raison</h2>${bars(group(W30,w=>w.reason,w=>w.cost))}</div>
 <div class="card"><h2>Produits les plus gaspillés</h2>${bars(group(W30,w=>w.product,w=>w.cost))}</div></div>`};

/* ========= Achats et factures (responsable) ========= */
const UALIAS={piece:"pièce",pieces:"pièce",pcs:"pièce",pc:"pièce",u:"pièce",unite:"pièce",unites:"pièce",portion:"portion",portions:"portion",g:"g",gr:"g",gramme:"g",grammes:"g",kg:"kg",kilo:"kg",kilos:"kg",ml:"mL",l:"L",litre:"L",litres:"L"};
const normUnit=s=>UALIAS[(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim()]||s;
function infoBox(title,html){const f=$("#dform");f.onsubmit=e=>e.preventDefault();
 f.innerHTML=`<h2>${esc(title)}</h2>${html}<div class="acts"><button type="button" class="btn" id="fc">Fermer</button></div>`;$("#fc").onclick=()=>$("#dlg").close();$("#dlg").showModal()}
function addPurchase(l){
 l.product=(l.product||"").trim();
 if(!l.product)return"Indiquez le produit.";
 if(!UN[l.unit])return`Unité inconnue « ${l.unit} ».`;
 if(!(l.qty>0))return"La quantité doit être supérieure à 0.";
 if(!(l.total>0))return"Le total payé doit être supérieur à 0.";
 if(!l.date||l.date>day(0))return"La date est invalide ou dans le futur.";
 if(l.exp&&!/^\d{4}-\d{2}-\d{2}$/.test(l.exp))return"Date de péremption invalide.";
 const fam=UN[l.unit].fam,up=+(l.total/(l.qty*UN[l.unit].f)).toFixed(4);
 const p=db.products.find(x=>x.restaurant===me.restaurant&&x.name.toLowerCase()===l.product.toLowerCase());
 if(p){if(FAM[p.unit]!==fam)return`« ${p.name} » est géré en ${p.unit} dans le catalogue : utilisez une unité compatible.`;p.price=up;p.qty=+((+p.qty||0)+l.qty*UN[l.unit].f/UN[p.unit].f).toFixed(3);if(l.exp)p.expiry=l.exp}
 else db.products.push({id:uid(),restaurant:me.restaurant,name:l.product,cat:CATS.includes(l.cat)?l.cat:"Autre",unit:fam==="n"?l.unit:BASEU[fam],price:up,qty:+(l.qty*UN[l.unit].f/UN[fam==="n"?l.unit:BASEU[fam]].f).toFixed(3),expiry:l.exp||""});
 db.purchases.push({id:uid(),restaurant:me.restaurant,date:l.date,supplier:l.supplier||"",product:p?p.name:l.product,qty:l.qty,unit:l.unit,total:l.total,unitPrice:up,baseUnit:p?p.unit:(fam==="n"?l.unit:BASEU[fam])});
 return null}
PAGES.responsable.achats=()=>{const A=db.purchases.filter(a=>a.restaurant===me.restaurant);
 return`<div class="bar-top"><h1>Achats et factures</h1><div style="display:flex;gap:.5rem;flex-wrap:wrap"><button class="btn sec" id="csvm">Télécharger le modèle CSV</button><button class="btn sec" id="csvi">Importer un fichier CSV</button><button class="btn" id="adda">Ajouter un achat</button></div></div>
 <input type="file" id="csvf" accept=".csv,.txt,text/csv" class="hidden">
 <div class="note">Le prix unitaire est calculé automatiquement (total payé ÷ quantité) et met à jour le catalogue, donc le coût des gaspillages. Chaque achat ajoute aussi la quantité au stock. Les factures PDF ou photos ne sont pas lues automatiquement dans cette version : la lecture automatique demande un service côté serveur, prévu avec Supabase. En attendant, saisissez les lignes ou importez un fichier CSV. Pour fixer un prix à la main, modifiez le produit dans le catalogue.</div>`+
 (A.length?`<div class="tw"><table><thead><tr><th>Date</th><th>Fournisseur</th><th>Produit</th><th>Quantité</th><th>Total payé</th><th>Prix unitaire calculé</th><th>Action</th></tr></thead><tbody>`+
 A.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(a=>`<tr><td>${fdate(a.date)}</td><td>${esc(a.supplier||"–")}</td><td><b>${esc(a.product)}</b></td><td>${num(a.qty)} ${esc(a.unit)}</td><td>${eur(a.total)}</td><td>${pfmt(a.unitPrice)} / ${esc(a.baseUnit)}</td><td><button class="btn danger sm" data-dela="${a.id}">Supprimer</button></td></tr>`).join("")+"</tbody></table></div>":empty("Aucun achat enregistré. Ajoutez une facture ligne par ligne ou importez un fichier CSV."))};
function addPurchaseForm(){
 const P=db.products.filter(p=>p.restaurant===me.restaurant),f=$("#dform");
 f.innerHTML=`<h2>Ajouter un achat</h2>
 <label for="a_d">Date de la facture</label><input id="a_d" type="date" max="${day(0)}" value="${day(0)}" required>
 <label for="a_s">Fournisseur (facultatif)</label><input id="a_s" maxlength="60">
 <label for="a_p">Produit</label><input id="a_p" list="a_dl" maxlength="60" autocomplete="off" placeholder="Choisissez ou tapez un nouveau produit"><datalist id="a_dl">${P.map(p=>`<option value="${esc(p.name)}">`).join("")}</datalist>
 <label for="a_c">Catégorie (pour un nouveau produit)</label><select id="a_c">${CATS.map(c=>`<option>${esc(c)}</option>`).join("")}</select>
 <label for="a_q">Quantité achetée</label><div style="display:flex;gap:.5rem"><input id="a_q" type="number" min="0" step="any" inputmode="decimal" style="flex:1"><select id="a_u" style="flex:1" aria-label="Unité">${Object.keys(UN).map(u=>`<option ${u==="kg"?"selected":""}>${u}</option>`).join("")}</select></div>
 <label for="a_e">Date de péremption (facultatif)</label><input id="a_e" type="date">
 <label for="a_t">Total payé (€)</label><input id="a_t" type="number" min="0" step="any" inputmode="decimal">
 <p id="a_r" style="font-weight:700;margin:.6rem 0 0"></p>
 <div class="acts"><button type="button" class="btn sec" id="fc">Annuler</button><button class="btn">Enregistrer</button></div>`;
 function calc(){const q=parseFloat($("#a_q").value),t=parseFloat($("#a_t").value),u=$("#a_u").value;
  $("#a_r").textContent=(q>0&&t>0)?`Prix unitaire calculé : ${pfmt(t/(q*UN[u].f))} par ${BASEU[UN[u].fam]}`+(UN[u].f!==1?` (soit ${pfmt(t/q)} par ${u})`:""):"Prix unitaire calculé : –"}
 $("#a_p").oninput=()=>{const p=P.find(x=>x.name.toLowerCase()===$("#a_p").value.trim().toLowerCase());
  if(p&&FAM[p.unit]!==UN[$("#a_u").value].fam)$("#a_u").value=p.unit;calc()};
 ["a_q","a_t"].forEach(i=>$("#"+i).oninput=calc);$("#a_u").onchange=calc;
 $("#fc").onclick=()=>$("#dlg").close();
 f.onsubmit=e=>{e.preventDefault();
  const err=addPurchase({date:$("#a_d").value,supplier:$("#a_s").value.trim(),product:$("#a_p").value,cat:$("#a_c").value,qty:parseFloat($("#a_q").value),unit:$("#a_u").value,total:parseFloat($("#a_t").value),exp:$("#a_e").value});
  if(err){toast(err,1);return}
  const a=db.purchases[db.purchases.length-1];save();$("#dlg").close();route();toast(`Achat enregistré : ${pfmt(a.unitPrice)} par ${a.baseUnit}, catalogue mis à jour.`)};
 $("#dlg").showModal();
}
function parseCSV(text){
 const lines=text.replace(/^\uFEFF/,"").split(/\r?\n/).map((l,i)=>({l,n:i+1})).filter(x=>x.l.trim());
 if(lines.length<2)return{err:"Le fichier doit contenir une ligne d'en-têtes et au moins une ligne de données."};
 const d=lines[0].l.split(";").length>=lines[0].l.split(",").length?";":",";
 const split=s=>{const o=[];let c="",q=false;for(const ch of s){if(ch==='"')q=!q;else if(ch===d&&!q){o.push(c);c=""}else c+=ch}o.push(c);return o.map(x=>x.trim())};
 const H=split(lines[0].l).map(s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z]/g,""));
 const ix=(...k)=>H.findIndex(h=>k.includes(h));
 const c={date:ix("date"),sup:ix("fournisseur"),prod:ix("produit","article","designation"),qty:ix("quantite","qte"),unit:ix("unite"),tot:ix("total","totalpaye","montant","totalht","prixtotal"),cat:ix("categorie"),exp:ix("peremption","datedeperemption","dlc")};
 if(c.prod<0||c.qty<0||c.unit<0||c.tot<0)return{err:"Colonnes obligatoires manquantes : produit, quantite, unite, total."};
 const nb=s=>{s=String(s||"").replace(/[€\s]/g,"");if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");return parseFloat(s)};
 const dt=s=>{s=(s||"").trim();if(!s)return day(0);let m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);if(m)return s;m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);return m?`${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`:"invalide"};
 return{rows:lines.slice(1).map(x=>{const r=split(x.l),g=i=>i<0?"":(r[i]||"");
  return{n:x.n,line:{date:dt(g(c.date)),supplier:g(c.sup),product:g(c.prod),cat:g(c.cat),qty:nb(g(c.qty)),unit:normUnit(g(c.unit)),total:nb(g(c.tot)),exp:g(c.exp)?dt(g(c.exp)):""}}})};
}
function importCSV(text){
 const res=parseCSV(text);if(res.err){infoBox("Import impossible",`<p>${esc(res.err)}</p>`);return}
 let ok=0;const errs=[];
 res.rows.forEach(r=>{const e=addPurchase(r.line);if(e)errs.push(`Ligne ${r.n} : ${e}`);else ok++});
 if(ok)save();route();
 infoBox("Import terminé",`<p><b>${ok}</b> ligne(s) importée(s), <b>${errs.length}</b> ignorée(s).</p>`+(errs.length?`<ul>${errs.slice(0,8).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>${errs.length>8?`<p>… et ${errs.length-8} autre(s).</p>`:""}`:"")+(ok?"<p>Les prix unitaires sont calculés et le catalogue est à jour.</p>":""))}
WIRE["responsable.achats"]=()=>{

 $("#csvm").onclick=()=>{const t="\uFEFFdate;fournisseur;produit;quantite;unite;total;categorie;peremption\n"+day(0)+";Grossiste Démo;Steak haché;10;kg;110;Viandes;"+day(5)+"\n"+day(0)+";Grossiste Démo;Pains burger;200;pièce;70;Boulangerie;"+day(3)+"\n";
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv;charset=utf-8"}));a.download="modele-achats.csv";a.click()};
 $("#csvi").onclick=()=>$("#csvf").click();
 $("#csvf").onchange=e=>{const file=e.target.files[0];if(!file)return;if(file.size>1e6){toast("Fichier trop volumineux (1 Mo maximum).",1);return}
  const r=new FileReader();r.onload=()=>importCSV(String(r.result));r.readAsText(file,"utf-8")};
 document.querySelectorAll("[data-dela]").forEach(b=>b.onclick=()=>confirmBox("Supprimer cet achat","La ligne est retirée de l'historique ; le prix du catalogue n'est pas modifié.","Supprimer",()=>{db.purchases=db.purchases.filter(a=>a.id!==b.dataset.dela);save();route();toast("Achat supprimé.")}))};

function requestForm(){

 f.innerHTML=`<h2>Demander un accès</h2><p style="color:var(--mute);font-size:.9rem">Réservé aux restaurants et fast-foods. L'administrateur examine votre demande, puis vous envoie une invitation.</p>

 <label for="q_t">Type</label><select id="q_t"><option>Restaurant</option><option>Fast-food</option><option>Snack</option></select>
 <label for="q_v">Ville</label><input id="q_v" required maxlength="60">
 <label for="q_c">Nom du contact</label><input id="q_c" required maxlength="80">
 <label for="q_e">E-mail</label><input id="q_e" type="email" required maxlength="120">
 <label for="q_p">Téléphone (facultatif)</label><input id="q_p" type="tel" maxlength="30">
 <input id="q_h" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px">
 <label style="display:flex;gap:.5rem;align-items:flex-start;font-weight:400;margin-top:1rem"><input type="checkbox" id="q_ok" style="width:auto;margin-top:.25rem" required><span>J'accepte que ces informations soient utilisées pour traiter ma demande d'accès.</span></label>
 <small style="color:var(--mute)">Vos droits (accès, rectification, suppression) sont détaillés dans la politique de confidentialité, en bas de la page de connexion.</small>
 <div class="acts"><button type="button" class="btn sec" id="fc">Annuler</button><button class="btn">Envoyer la demande</button></div>`;
 $("#fc").onclick=()=>$("#dlg").close();
 f.onsubmit=e=>{e.preventDefault();
  if($("#q_h").value){$("#dlg").close();return}
  if(!$("#q_ok").checked){toast("Vous devez accepter le traitement de vos données pour envoyer la demande.",1);return}
  db.requests.push({id:uid(),date:day(0),name:$("#q_n").value.trim(),type:$("#q_t").value,city:$("#q_v").value.trim(),contact:$("#q_c").value.trim(),email:$("#q_e").value.trim().toLowerCase(),phone:$("#q_p").value.trim(),status:"En attente",consent:true,consentAt:new Date().toISOString(),consentVersion:CONSENT_VERSION});
  save();$("#dlg").close();toast("Demande envoyée. Démonstration : aucun e-mail n'est réellement envoyé.")};
 $("#dlg").showModal();
}
