<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AntiGaspiPro – Réduire le gaspillage en restauration</title>
<style>
:root{--bg:#f2f5f0;--card:#fff;--ink:#1b2a22;--mute:#5d6b63;--line:#dde4dc;--g:#1f6f46;--g2:#e3f1e8;--am:#b7791f;--am2:#fcf1d9;--rd:#b42318;--rd2:#fde8e6;--bl:#175cd3;--bl2:#e4edfb;--r:10px}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2{margin:0 0 .5em;line-height:1.25;font-family:Georgia,"Times New Roman",serif}
h1{font-size:1.6rem}h2{font-size:1.2rem}
button,input,select{font:inherit}
:focus-visible{outline:3px solid var(--bl);outline-offset:2px}
.btn{border:1px solid var(--g);background:var(--g);color:#fff;padding:.5rem .9rem;border-radius:8px;cursor:pointer;font-weight:600}
.btn:hover{filter:brightness(1.1)}
.btn.sec{background:#fff;color:var(--g)}
.btn.danger{background:#fff;color:var(--rd);border-color:var(--rd)}
.btn.sm{padding:.25rem .6rem;font-size:.85rem}
.hidden{display:none!important}
.demo-bar{background:var(--am2);color:#6b4710;font-size:.85rem;padding:.4rem 1rem;text-align:center}
#login{min-height:calc(100vh - 34px);display:grid;grid-template-columns:1fr 1fr}
.l-left{background:var(--g);color:#fff;padding:3rem;display:flex;flex-direction:column;justify-content:center}
.l-left h1{font-size:2.6rem}
.l-left p{max-width:36ch;font-size:1.1rem;opacity:.92}
.l-right{display:flex;align-items:center;justify-content:center;padding:2rem}
.box{width:100%;max-width:410px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1.6rem}
label{display:block;font-weight:600;margin:.8rem 0 .25rem;font-size:.9rem}
input,select{width:100%;padding:.55rem .65rem;border:1px solid #c5cfc6;border-radius:8px;background:#fff}
.demo{background:var(--g2);border-radius:8px;padding:.7rem;font-size:.88rem;margin-top:1rem}
.demo button{display:block;width:100%;text-align:left;background:none;border:0;padding:.3rem 0;cursor:pointer;color:var(--g);font-weight:600}
.err{background:var(--rd2);color:var(--rd);padding:.55rem .7rem;border-radius:8px;margin-top:.8rem;font-size:.9rem}
#app{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 34px)}
aside{background:#14271d;color:#dfe9e2;padding:1rem;position:sticky;top:0;height:100vh}
aside .logo{font:700 1.2rem Georgia,serif;color:#fff;margin-bottom:1.2rem}
aside a{display:block;color:#cfe0d5;text-decoration:none;padding:.55rem .7rem;border-radius:8px;margin-bottom:2px}
aside a.on,aside a:hover{background:#24402f;color:#fff}
main{min-width:0}
header{display:flex;gap:.8rem;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line);padding:.7rem 1.2rem;flex-wrap:wrap}
.who{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.role{background:var(--g2);color:var(--g);border-radius:99px;padding:.15rem .7rem;font-weight:700;font-size:.82rem}
#burger{display:none}
#view{padding:1.2rem;max-width:1150px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.9rem;margin-bottom:1.2rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1rem}
.stat b{display:block;font:700 1.7rem Georgia,serif}
.stat span{color:var(--mute);font-size:.88rem}
.bar{display:flex;align-items:center;gap:.6rem;margin:.45rem 0;font-size:.9rem}
.bar i{display:block;height:12px;background:var(--g);border-radius:6px;min-width:3px}
.bar span:first-child{width:140px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evo{display:flex;align-items:flex-end;gap:.6rem;height:170px;padding-top:1.2rem}
.evo div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.78rem;color:var(--mute);text-align:center}
.evo i{display:block;width:100%;background:var(--g);border-radius:6px 6px 0 0;min-height:2px}
.evo i.now{background:var(--am)}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%}
th,td{padding:.6rem .75rem;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:#f7f9f6;font-size:.85rem;color:var(--mute)}
tr:last-child td{border-bottom:0}
.badge{display:inline-block;padding:.1rem .6rem;border-radius:99px;font-size:.8rem;font-weight:700}
.b-ok{background:var(--g2);color:var(--g)}.b-urg{background:var(--rd2);color:var(--rd)}.b-info{background:var(--bl2);color:var(--bl)}.b-fic{background:var(--am2);color:var(--am)}
.bar-top{display:flex;justify-content:space-between;align-items:center;gap:.6rem;margin-bottom:.9rem;flex-wrap:wrap}
.empty{text-align:center;padding:2rem 1rem;color:var(--mute)}
.note{background:var(--am2);color:#6b4710;border-radius:8px;padding:.6rem .8rem;font-size:.88rem;margin-bottom:1rem}
dialog{border:0;border-radius:var(--r);padding:1.3rem;width:min(560px,94vw);max-height:88vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.45)}
.acts{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1.1rem}
#toast{position:fixed;bottom:1rem;right:1rem;z-index:99;display:grid;gap:.4rem}
.t{background:var(--ink);color:#fff;padding:.6rem .9rem;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.t.e{background:var(--rd)}
@media(max-width:800px){
#login{grid-template-columns:1fr}.l-left{padding:1.6rem}.l-left h1{font-size:1.8rem}
#app{grid-template-columns:1fr}
aside{position:fixed;z-index:20;width:240px;left:-260px;transition:left .2s}
aside.open{left:0}
#burger{display:inline-block}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.fast{display:grid;gap:.4rem;max-width:520px}.cost{font:700 1.3rem Georgia,serif;color:var(--g);min-height:1.6rem}.big{width:100%;padding:.9rem;font-size:1.05rem;margin-top:.6rem}
#errbox{background:var(--rd2);color:var(--rd);padding:1rem;margin:1rem;border-radius:8px;white-space:pre-wrap}
.linkbtn{background:none;border:0;color:var(--g);text-decoration:underline;cursor:pointer;padding:0;font:inherit}
aside .linkbtn{color:#9fb8a8}
</style>
</head>
<body>
<div class="demo-bar" id="demobar"></div>

<section id="login">
  <div class="l-left">
    <h1>AntiGaspiPro</h1>
    <p>Enregistrez ce qui est jeté, comprenez pourquoi, et réduisez le gaspillage de votre restaurant ou fast-food.</p>
  </div>
  <div class="l-right">
    <form class="box" id="lform" autocomplete="off">
      <h2>Connexion</h2>
      <label for="em">Adresse e-mail</label>
      <input id="em" type="email" required placeholder="vous@exemple.fr">
      <label for="pw">Mot de passe</label>
      <input id="pw" type="password" required>
      <div id="lerr" class="err hidden" role="alert"></div>
      <button class="btn" style="width:100%;margin-top:1rem">Se connecter</button>
      <div class="note">Connexion réelle Supabase. Utilisez votre compte personnel, pas demo123.</div>
      <p style="text-align:center;margin:1rem 0 .4rem"><button type="button" class="linkbtn" id="reqopen">Demander un accès pour mon restaurant</button></p>
      <p style="text-align:center;font-size:.8rem;color:var(--mute);margin:0"><button type="button" class="linkbtn" data-legal="mentions">Mentions légales</button> · <button type="button" class="linkbtn" data-legal="privacy">Confidentialité</button> · <button type="button" class="linkbtn" data-legal="cgu">Conditions</button></p>
    </form>
  </div>
</section>

<div id="app" class="hidden">
  <aside id="side"><div class="logo">AntiGaspiPro</div><nav id="nav"></nav><div style="margin-top:1.2rem;font-size:.78rem"><button type="button" class="linkbtn" data-legal="mentions">Mentions légales</button><br><button type="button" class="linkbtn" data-legal="privacy">Confidentialité</button> · <button type="button" class="linkbtn" data-legal="cgu">Conditions</button></div></aside>
  <main>
    <header>
      <div class="who"><button id="burger" class="btn sec sm" aria-label="Ouvrir le menu">☰ Menu</button><strong id="uname"></strong><span class="role" id="urole"></span><span id="urest" style="color:var(--mute)"></span></div>
      <button class="btn sec sm" id="logout">Se déconnecter</button>
    </header>
    <div id="view"></div>
  </main>
</div>

<dialog id="dlg"><form method="dialog" id="dform"></form></dialog>
<div id="toast" aria-live="polite"></div>

<div id="errbox" class="hidden" role="alert"></div>
<script>
window.bibliothequePrete=new Promise(function(resolve,reject){
 var status=document.createElement('p');status.id='etatTechnique';status.style.cssText='padding:12px;background:#fcf1d9;border-radius:8px';status.textContent='Chargement de la connexion…';document.getElementById('lform').appendChild(status);
 var sources=['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js','https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js'];
 function load(i){if(i===sources.length){status.textContent='Bibliothèque inaccessible : vérifiez votre réseau.';reject(Error(status.textContent));return;}var tag=document.createElement('script'),done=false;var timer=setTimeout(function(){finish(false)},10000);function finish(ok){if(done)return;done=true;clearTimeout(timer);if(ok&&window.supabase)resolve();else load(i+1);}tag.onload=function(){finish(true)};tag.onerror=function(){finish(false)};tag.src=sources[i];document.head.appendChild(tag);}load(0);
});
window.bibliothequePrete.catch(function(){});
</script>
<script>
"use strict";
const URL_PROJET="https://fsscahhpgdaaavzwmeef.supabase.co";
const CLE_PUBLIQUE="sb_publishable_NcsiR8h1F5UpsfsFVAdVmQ_sOlyx4Ge";
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const euro=v=>Number(v||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:4});
const jour=(offset=0)=>{const d=new Date();d.setDate(d.getDate()+offset);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
let client,user,profil,page='accueil',data={};
const roles={admin:'Administrateur',responsable:'Responsable',employe:'Employé'};
const units=['kg','g','L','mL','pièce','portion'];
const motifs=['Invendu en fin de service','Date dépassée','Surproduction','Erreur de préparation','Produit abîmé','Retour client','Restes d’assiette','Chaîne du froid rompue'];
function etat(t){const el=document.getElementById('etatTechnique');if(el)el.textContent=t;}
async function attente(p){let timer;try{return await Promise.race([p,new Promise((_,rej)=>timer=setTimeout(()=>rej(Error('Délai dépassé : la requête ne répond pas.')),20000))])}finally{clearTimeout(timer)}}
function erreur(e){etat(e.message||String(e));$('#errbox').textContent='Erreur : '+(e.message||e);$('#errbox').classList.remove('hidden')}
function toast(t){const n=document.createElement('div');n.className='t';n.textContent=t;$('#toast').append(n);setTimeout(()=>n.remove(),4500)}
async function run(f){$('#errbox').classList.add('hidden');try{await f()}catch(e){erreur(e)}}
window.addEventListener('error',e=>erreur(e.error||e.message));
window.addEventListener('unhandledrejection',e=>erreur(e.reason));
async function lire(table){let all=[];for(let start=0;;start+=500){const {data:d,error}=await client.from(table).select('*').order('id').range(start,start+499);if(error)throw error;all.push(...d);if(d.length<500)return all}}
async function charger(){
 const tables=['restaurants','products','waste_logs'];
 if(profil.role!=='employe')tables.push('purchases');
 if(profil.role==='admin')tables.push('access_requests','profiles');
 const vals=await Promise.all(tables.map(lire));data={};tables.forEach((t,i)=>data[t]=vals[i]);
}
async function ecrire(table,obj,id){const q=id?client.from(table).update(obj).eq('id',id):client.from(table).insert(obj);const {data:d,error}=await q.select('id');if(error)throw error;if(!d?.length)throw Error('Aucune ligne enregistrée. Vérifiez les droits RLS.');await charger();afficher();toast('Enregistrement confirmé dans Supabase.');}
async function supprimer(table,id){if(!confirm('Supprimer cette ligne ? Cette opération concerne la base Supabase.'))return;const {data:d,error}=await client.from(table).delete().eq('id',id).select('id');if(error)throw error;if(!d?.length)throw Error('Suppression refusée ou ligne introuvable.');await charger();afficher();toast('Suppression confirmée.');}
function formulaire(titre,champs,initial,submit){
 $('#dform').innerHTML='<h2>'+esc(titre)+'</h2>'+champs.map(c=>{
 const v=initial[c.k]??'';let field;
 if(c.options)field='<select id="f_'+c.k+'">'+c.options.map(o=>{const a=Array.isArray(o)?o:[o,o];return '<option value="'+esc(a[0])+'" '+(String(a[0])===String(v)?'selected':'')+'>'+esc(a[1])+'</option>'}).join('')+'</select>';
 else field='<input id="f_'+c.k+'" type="'+(c.type||'text')+'" value="'+esc(v)+'" '+(c.type==='number'?'min="0" step="any"':'')+' '+(c.optional?'':'required')+'>';
 return '<label for="f_'+c.k+'">'+esc(c.label)+'</label>'+field;
 }).join('')+'<div id="dialogError" class="err hidden"></div><div class="acts"><button type="button" class="btn sec" id="annuler">Annuler</button><button class="btn" id="valider">Enregistrer</button></div>';
 $('#annuler').onclick=()=>$('#dlg').close();
 $('#dform').onsubmit=async e=>{e.preventDefault();const b=$('#valider');b.disabled=true;try{const v={};champs.forEach(c=>v[c.k]=c.type==='number'?Number($('#f_'+c.k).value):$('#f_'+c.k).value.trim());await submit(v);$('#dlg').close()}catch(e){$('#dialogError').textContent=e.message||e;$('#dialogError').classList.remove('hidden')}finally{b.disabled=false}};
 $('#dlg').showModal();
}
function tableau(headers,rows){return rows.length?'<div class="tw"><table><thead><tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>':'<div class="card empty">Aucune donnée enregistrée dans Supabase.</div>'}
function carte(v,l){return '<div class="card stat"><b>'+v+'</b><span>'+l+'</span></div>'}
const nomRestaurant=id=>data.restaurants?.find(r=>r.id===id)?.name||'Restaurant non accessible';
function volume(list){let q={};list.forEach(w=>{let u=w.unit,n=Number(w.quantity);if(u==='g'||u==='g'){u='kg';n/=1000}q[u]=(q[u]||0)+n});return Object.entries(q).map(([u,n])=>n.toLocaleString('fr-FR')+' '+esc(u)).join(' · ')||'0'}
const cout=list=>list.reduce((a,w)=>a+Number(w.estimated_cost),0);
const current=list=>list.filter(w=>w.wasted_on>=jour(-29)&&w.wasted_on<=jour());
const previous=list=>list.filter(w=>w.wasted_on>=jour(-59)&&w.wasted_on<jour(-29));
function bilan(){let all=data.waste_logs||[],w=current(all),p=previous(all);let diff=cout(p)-cout(w);
 return '<h1>'+ (profil.role==='admin'?'Vue globale de la plateforme':'Tableau de bord du restaurant')+'</h1><div class="note">Données réellement enregistrées dans Supabase. Période actuelle : '+jour(-29)+' au '+jour()+'. Comparaison : '+jour(-59)+' au '+jour(-30)+'. Une baisse des pertes enregistrées ne prouve pas une économie de trésorerie ; elle dépend aussi de l’activité et de la qualité des saisies.</div><div class="grid">'+carte(euro(cout(w)),'Coût des pertes — 30 jours')+carte(volume(w),'Quantités gaspillées, unités séparées')+carte(w.length,'Saisies — 30 jours')+carte(euro(cout(w)*.2),'Économies potentielles : hypothèse −20 %, non réalisées')+carte(p.length?euro(diff):'Historique insuffisant','Baisse des pertes vs 30 jours précédents (négatif = hausse)')+'</div>'+ (profil.role==='admin'?tableau(['Restaurant','Volumes — 30 jours','Pertes — 30 jours','Baisse des pertes'],data.restaurants.map(r=>{let a=all.filter(x=>x.restaurant_id===r.id),c=current(a),b=previous(a);return [esc(r.name),volume(c),euro(cout(c)),b.length?euro(cout(b)-cout(c)):'Historique insuffisant']})):'')+evolution(all);
}
function evolution(all){let days={};current(all).forEach(w=>days[w.wasted_on]=(days[w.wasted_on]||0)+Number(w.estimated_cost));return '<h2>Évolution du coût des pertes</h2>'+tableau(['Date','Coût'],Object.entries(days).sort().map(([d,c])=>[esc(d),euro(c)]))}
const restFields=[{k:'name',label:'Nom du restaurant'},{k:'type',label:'Type',options:['Restaurant','Fast-food','Snack']},{k:'city',label:'Ville'}];
const prodFields=[{k:'name',label:'Nom'},{k:'category',label:'Catégorie',options:['Viandes','Poissons','Fruits et légumes','Produits laitiers','Boulangerie','Plats préparés','Autre']},{k:'unit',label:'Unité du prix',options:['kg','L','pièce','portion']},{k:'unit_cost',label:'Coût d’achat par unité (€)',type:'number'},{k:'stock_qty',label:'Stock',type:'number'},{k:'expiry_date',label:'Date de péremption',type:'date',optional:true}];
function afficher(){
 const admin=profil.role==='admin',resp=profil.role==='responsable';
 const menus=admin?[['accueil','Vue globale'],['restaurants','Restaurants inscrits'],['demandes','Demandes d’accès'],['catalogue','Catalogue (lecture)'],['pertes','Gaspillages'],['achats','Achats (lecture)']]:resp?[['accueil','Tableau de bord'],['catalogue','Catalogue produits'],['saisie','Enregistrer un gaspillage'],['pertes','Gaspillages'],['achats','Achats et factures']]:[['saisie','Enregistrer un gaspillage'],['catalogue','Catalogue du restaurant'],['pertes','Mes saisies']];
 if(!menus.some(m=>m[0]===page))page=menus[0][0];
 $('#nav').innerHTML=menus.map(([p,l])=>'<a href="#/'+p+'" data-page="'+p+'" class="'+(p===page?'on':'')+'">'+l+'</a>').join('')+'<button class="btn sec sm" id="actualiser">Actualiser depuis Supabase</button>';
 $('#actualiser').onclick=()=>run(async()=>{await charger();afficher()});
 document.querySelectorAll('[data-page]').forEach(a=>a.onclick=e=>{e.preventDefault();page=a.dataset.page;history.replaceState(null,'','#/'+page);$('#side').classList.remove('open');afficher()});
 let h='';
 if(page==='accueil')h=bilan();
 if(page==='restaurants')h='<div class="bar-top"><h1>Restaurants inscrits</h1><button class="btn" id="addrest">Ajouter un restaurant</button></div><div class="note">Créer un restaurant ne crée pas de compte utilisateur. Les invitations nécessitent un service sécurisé côté serveur. La suspension est enregistrée ; les règles RLS actuelles ne bloquent pas encore toutes les opérations des comptes déjà connectés.</div>'+tableau(['Restaurant','Type','Ville','Statut','Actions'],data.restaurants.map(r=>[esc(r.name),esc(r.type),esc(r.city),esc(r.status),'<button class="btn sec sm" data-restedit="'+r.id+'">Modifier</button> <button class="btn sec sm" data-toggle="'+r.id+'">'+(r.status==='Actif'?'Suspendre':'Réactiver')+'</button> <button class="btn danger sm" data-del="restaurants" data-id="'+r.id+'">Supprimer</button>']));
 if(page==='catalogue')h='<div class="bar-top"><h1>Catalogue du restaurant</h1>'+(resp?'<button class="btn" id="addprod">Ajouter un produit</button>':'')+'</div>'+tableau(['Produit','Restaurant','Stock','Péremption','Prix / unité',...(resp?['Actions']:[])],data.products.map(p=>{let urgent=p.expiry_date&&p.expiry_date<=jour(2);return [esc(p.name),esc(nomRestaurant(p.restaurant_id)),esc(p.stock_qty)+' '+esc(p.unit),esc(p.expiry_date||'Non renseignée')+(urgent?' <span class="badge b-urg">À surveiller</span>':''),euro(p.unit_cost)+' / '+esc(p.unit),...(resp?['<button class="btn sec sm" data-prodedit="'+p.id+'">Modifier</button> <button class="btn danger sm" data-del="products" data-id="'+p.id+'">Supprimer</button>']:[])]}));
 if(page==='pertes')h='<h1>'+ (admin?'Tous les gaspillages':resp?'Gaspillages du restaurant':'Mes saisies')+'</h1>'+tableau(['Date','Restaurant','Produit','Quantité','Motif','Coût',...(admin||resp?['Action']:[])],(data.waste_logs||[]).slice().sort((a,b)=>b.wasted_on.localeCompare(a.wasted_on)).map(w=>[esc(w.wasted_on),esc(nomRestaurant(w.restaurant_id)),esc(w.product_name),esc(w.quantity)+' '+esc(w.unit),esc(w.reason),euro(w.estimated_cost),...(admin||resp?['<button class="btn danger sm" data-del="waste_logs" data-id="'+w.id+'">Supprimer</button>']:[])]));
 if(page==='saisie')h='<h1>Enregistrer un gaspillage</h1><div class="card"><form id="fast" class="fast"></form></div>';
 if(page==='achats')h='<div class="bar-top"><h1>Achats et factures</h1>'+(resp?'<div><button class="btn" id="addpurchase">Ajouter un achat</button> <button class="btn sec" id="importcsv">Importer CSV</button> <button class="btn sec" id="modele">Modèle CSV</button><input type="file" id="csvfile" accept=".csv" class="hidden"></div>':'')+'</div><div class="note">Import CSV uniquement, pas de reconnaissance des PDF ou photos. Chaque ligne calcule total ÷ quantité ; le catalogue est mis à jour dans une deuxième opération. Les deux opérations ne sont pas encore transactionnelles.</div>'+tableau(['Date','Produit','Quantité','Total','Coût / unité',...(resp?['Action']:[])],(data.purchases||[]).map(a=>[esc(a.purchased_on),esc(a.product_name),esc(a.quantity)+' '+esc(a.unit),euro(a.total_paid),euro(a.unit_price)+' / '+esc(a.unit),...(resp?['<button class="btn danger sm" data-del="purchases" data-id="'+a.id+'">Supprimer</button>']:[])]));
 if(page==='demandes')h='<h1>Demandes d’accès</h1><div class="note">Vous pouvez consulter et refuser les demandes. L’acceptation avec création de compte et invitation n’est pas encore configurée ; aucune invitation fictive n’est envoyée.</div>'+tableau(['Restaurant','Contact','Email','Téléphone','Statut','Actions'],(data.access_requests||[]).map(a=>[esc(a.restaurant_name),esc(a.contact_name),esc(a.email),esc(a.phone),esc(a.status),'<button class="btn sec sm" data-refuse="'+a.id+'">Refuser</button> <button class="btn danger sm" data-del="access_requests" data-id="'+a.id+'">Supprimer</button>']));
 $('#view').innerHTML=h;
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>run(()=>supprimer(b.dataset.del,b.dataset.id)));
 document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>run(()=>{const r=data.restaurants.find(x=>x.id===b.dataset.toggle);return ecrire('restaurants',{status:r.status==='Actif'?'Suspendu':'Actif'},r.id)}));
 document.querySelectorAll('[data-restedit]').forEach(b=>b.onclick=()=>{const r=data.restaurants.find(x=>x.id===b.dataset.restedit);formulaire('Modifier le restaurant',restFields,r,v=>ecrire('restaurants',v,r.id))});
 if($('#addrest'))$('#addrest').onclick=()=>formulaire('Ajouter un restaurant',restFields,{},v=>ecrire('restaurants',{...v,status:'En attente'}));
 const editProd=(p)=>formulaire(p?'Modifier le produit':'Ajouter un produit',prodFields,p||{unit:'kg',stock_qty:0,unit_cost:0},v=>{if(!(v.unit_cost>0))throw Error('Le coût unitaire doit être supérieur à zéro.');v.expiry_date=v.expiry_date||null;return ecrire('products',{...v,restaurant_id:profil.restaurant_id},p?.id)});
 if($('#addprod'))$('#addprod').onclick=()=>editProd(null);
 document.querySelectorAll('[data-prodedit]').forEach(b=>b.onclick=()=>editProd(data.products.find(x=>x.id===b.dataset.prodedit)));
 document.querySelectorAll('[data-refuse]').forEach(b=>b.onclick=()=>run(()=>ecrire('access_requests',{status:'Refusée'},b.dataset.refuse)));
 if(page==='saisie')saisie();
 if(resp&&page==='achats')achats();
}
function compat(unit){return unit==='kg'||unit==='grammes'||unit==='g'?['kg','g']:unit==='L'||unit==='mL'?['L','mL']:[unit]}
function montant(p,q,u){if(!compat(p.unit).includes(u))throw Error('Unité incompatible avec le prix du catalogue. Une portion doit avoir son propre prix, ou un poids défini.');let ratio=1;if(p.unit==='kg'&&u==='g')ratio=.001;if((p.unit==='grammes'||p.unit==='g')&&u==='kg')ratio=1000;if(p.unit==='L'&&u==='mL')ratio=.001;if(p.unit==='mL'&&u==='L')ratio=1000;return q*Number(p.unit_cost)*ratio}
function saisie(){const ps=data.products||[];if(!ps.length){$('#fast').innerHTML='<p>Catalogue vide : demandez au responsable d’ajouter des produits.</p>';return}
 $('#fast').innerHTML='<label for="wp">Produit</label><select id="wp">'+ps.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('')+'</select><label for="wq">Quantité exacte</label><input id="wq" type="number" min="0.0001" step="any" inputmode="decimal" required placeholder="Exemple : 250"><label for="wu">Unité compatible</label><select id="wu"></select><label for="wr">Raison</label><select id="wr">'+motifs.map(m=>'<option>'+esc(m)+'</option>').join('')+'</select><label for="wd">Date</label><select id="wd">'+Array.from({length:31},(_,i)=>'<option value="'+jour(-i)+'">'+(i===0?'Aujourd’hui':i===1?'Hier':jour(-i))+'</option>').join('')+'</select><p id="wc" class="cost"></p><button class="btn big">Enregistrer le gaspillage</button>';
 const p=()=>ps.find(x=>x.id===$('#wp').value);
 const calc=()=>{const q=Number($('#wq').value);$('#wc').textContent=q>0?'Coût estimé : '+euro(montant(p(),q,$('#wu').value)):'Entrez la quantité';};
 const unit=()=>{$('#wu').innerHTML=compat(p().unit).map(u=>'<option>'+esc(u)+'</option>').join('');$('#wu').value=p().unit==='g'?'grammes':p().unit;calc()};
 $('#wp').onchange=unit;$('#wu').onchange=calc;$('#wq').oninput=calc;unit();
 $('#fast').onsubmit=e=>{e.preventDefault();run(async()=>{const b=$('#fast button');b.disabled=true;try{const prod=p(),q=Number($('#wq').value);if(!(q>0))throw Error('Quantité invalide');await ecrire('waste_logs',{restaurant_id:profil.restaurant_id,product_id:prod.id,product_name:prod.name,quantity:q,unit:$('#wu').value,estimated_cost:Number(montant(prod,q,$('#wu').value).toFixed(2)),reason:$('#wr').value,wasted_on:$('#wd').value,created_by:user.id});}finally{if(b.isConnected)b.disabled=false}})};
}
async function achat(v){
 if(!(v.quantity>0)||!(v.total_paid>0)||!units.includes(v.unit))throw Error('Quantité, unité ou total invalide.');
 let p=data.products.find(p=>p.restaurant_id===profil.restaurant_id&&p.name.toLowerCase()===v.product_name.toLowerCase());
 if(p&&!compat(p.unit).includes(v.unit))throw Error('Unité d’achat incompatible avec le produit '+v.product_name);
 const price=v.total_paid/v.quantity;
 const {error}=await client.from('purchases').insert({...v,restaurant_id:profil.restaurant_id,created_by:user.id,unit_price:price});if(error)throw error;
 let converted=price;if(p?.unit==='kg'&&v.unit==='g')converted*=1000;if((p?.unit==='grammes'||p?.unit==='g')&&v.unit==='kg')converted/=1000;
 const q=p?client.from('products').update({unit_cost:converted}).eq('id',p.id):client.from('products').insert({restaurant_id:profil.restaurant_id,name:v.product_name,category:'Autre',unit:v.unit,unit_cost:price,stock_qty:0,expiry_date:null});
 const {error:err}=await q;if(err)throw Error('Achat enregistré, mais prix du catalogue non mis à jour : '+err.message);
 await charger();
}
function achats(){
 const fields=[{k:'purchased_on',label:'Date de facture',type:'date'},{k:'supplier',label:'Fournisseur',optional:true},{k:'product_name',label:'Nom exact du produit'},{k:'quantity',label:'Quantité achetée',type:'number'},{k:'unit',label:'Unité',options:units},{k:'total_paid',label:'Total de la ligne (€), même base HT ou TTC pour tout le catalogue',type:'number'}];
 $('#addpurchase').onclick=()=>formulaire('Ajouter une ligne de facture',fields,{purchased_on:jour(),unit:'kg'},async v=>{await achat(v);afficher();toast('Achat et prix enregistrés.');});
 $('#modele').onclick=()=>{const blob=new Blob(['purchased_on;supplier;product_name;quantity;unit;total_paid\n'+jour()+';Grossiste;Frites surgelées;10;kg;22\n'],{type:'text/csv;charset=utf-8'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='modele-achats.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
 $('#importcsv').onclick=()=>$('#csvfile').click();
 $('#csvfile').onchange=e=>run(async()=>{const f=e.target.files[0];if(!f)return;if(f.size>1000000)throw Error('Maximum 1 Mo.');const rows=(await f.text()).replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());const head=rows.shift().split(';').map(x=>x.trim());const needed=fields.map(x=>x.k);if(needed.some(x=>!head.includes(x)))throw Error('Utilisez le modèle CSV fourni (séparateur point-virgule).');let ok=0,errs=[];for(let i=0;i<rows.length;i++){const cols=rows[i].split(';');if(cols.length!==head.length){errs.push('Ligne '+(i+2)+' : colonnes invalides');continue}let v={};head.forEach((k,j)=>v[k]=cols[j].trim());v.quantity=Number(v.quantity.replace(',','.'));v.total_paid=Number(v.total_paid.replace(',','.'));try{await achat(v);ok++}catch(e){errs.push('Ligne '+(i+2)+' : '+e.message)}}afficher();toast(ok+' ligne(s) traitée(s).');if(errs.length)throw Error(errs.join('\n'))});
}
async function ouvrir(){
 const {data:d,error}=await client.auth.getUser();if(error)throw error;user=d.user;if(!user)return;
 const {data:p,error:err}=await client.from('profiles').select('*').eq('id',user.id).maybeSingle();if(err)throw err;if(!p)throw Error('Compte authentifié mais profil introuvable. Contactez l’administrateur.');profil=p;
 if(!roles[p.role])throw Error('Rôle de profil invalide.');
 await charger();
 if(p.role!=='admin'){const r=data.restaurants.find(r=>r.id===p.restaurant_id);if(!r)throw Error('Aucun restaurant associé ou accès refusé.');if(r.status!=='Actif')throw Error('Votre restaurant n’est pas actif. Contactez l’administrateur.');}
 $('#uname').textContent=p.full_name||user.email;$('#urole').textContent=roles[p.role];$('#urest').textContent=p.role==='admin'?'Tous les restaurants':nomRestaurant(p.restaurant_id);
 $('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#demobar').textContent='Connexion Supabase active — données chargées selon vos droits. Version pilote, invitations non configurées.';
 page=location.hash.replace('#/','')||'accueil';afficher();
}
$('#lform').onsubmit=e=>{e.preventDefault();run(async()=>{const b=$('#lform button');b.disabled=true;$('#lerr').classList.add('hidden');try{etat('Connexion en cours…');if(!client)throw Error('Connexion pas encore prête. Attendez le message Prêt.');const {error}=await attente(client.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value}));if(error)throw error;etat('Identifiants acceptés : chargement du profil…');await attente(ouvrir());etat('Connexion réussie.');}catch(e){$('#lerr').textContent=e.message;$('#lerr').classList.remove('hidden');throw e}finally{b.disabled=false}})};
$('#logout').onclick=()=>run(async()=>{const {error}=await client.auth.signOut();if(error)throw error;user=null;profil=null;data={};$('#app').classList.add('hidden');$('#login').classList.remove('hidden');$('#pw').value='';$('#demobar').textContent='Supabase configuré — connectez-vous avec votre compte personnel.'});
$('#burger').onclick=()=>$('#side').classList.toggle('open');
$('#reqopen').onclick=()=>formulaire('Demander un accès — aucune inscription automatique',[{k:'restaurant_name',label:'Restaurant'},{k:'type',label:'Type',options:['Restaurant','Fast-food','Snack']},{k:'city',label:'Ville'},{k:'contact_name',label:'Contact'},{k:'email',label:'Email',type:'email'},{k:'phone',label:'Téléphone',optional:true},{k:'consent',label:'J’accepte le traitement de ces informations pour ma demande',options:[['non','Choisir'],['oui','Oui']]}],{},async v=>{if(v.consent!=='oui')throw Error('Consentement requis.');const {error}=await client.from('access_requests').insert({...v,status:'En attente',consent:true,consent_at:new Date().toISOString(),consent_version:'pilote-2026-10'});if(error)throw error;toast('Demande enregistrée. Aucun compte ni invitation créé.');});
 document.querySelectorAll('[data-legal]').forEach(b=>b.onclick=()=>{ $('#dform').innerHTML='<h2>Information — version pilote</h2><p>Les mentions légales, conditions et informations de confidentialité définitives doivent être complétées par l’éditeur avant ouverture au public. Les demandes d’accès sont stockées dans le projet Supabase pour être examinées par l’administrateur. Ne transmettez pas de données sensibles.</p><button class="btn" type="button" id="fermer">Fermer</button>';$('#fermer').onclick=()=>$('#dlg').close();$('#dlg').showModal();});
run(async()=>{await window.bibliothequePrete;if(!window.supabase)throw Error('Impossible de charger la bibliothèque Supabase. Vérifiez votre connexion ou votre bloqueur.');client=window.supabase.createClient(URL_PROJET,CLE_PUBLIQUE);$('#demobar').textContent='Supabase configuré — connexion personnelle requise, pas de données fictives.';const {data:d,error}=await attente(client.auth.getSession());if(error)throw error;if(d.session)await attente(ouvrir());else etat('Prêt : saisissez votre e-mail et votre mot de passe Supabase.');});

</script>
