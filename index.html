const stat=(v,l)=>`<div class="card stat"><b>${v}</b><span>${l}</span></div>`;
const empty=t=>`<div class="card empty">${t}</div>`;
function bars(map,fmt){const e=Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,7);if(!e.length)return'<div class="empty">Aucune donnée pour le moment.</div>';
 const m=e[0][1]||1;return e.map(([k,v])=>`<div class="bar"><span title="${esc(k)}">${esc(k)}</span><i style="width:${Math.max(3,v/m*55)}%"></i><span>${(fmt||eur)(v)}</span></div>`).join("")}
function evo(W){const b=[0,0,0,0,0,0];W.forEach(w=>{const k=Math.floor(ago(w.date)/7);if(k>=0&&k<6)b[k]+=w.cost});
 const m=Math.max(...b,1);
 return`<div class="evo">`+[5,4,3,2,1,0].map(k=>`<div><span>${b[k]?eur(b[k]):""}</span><i class="${k?"":"now"}" style="height:${b[k]/m*100*.8}%"></i>${k?`il y a ${k} sem.`:"cette sem."}</div>`).join("")+`</div>`}
function variation(W){const c=sum(W.filter(w=>ago(w.date)<7),w=>w.cost),p=sum(W.filter(w=>ago(w.date)>=7&&ago(w.date)<14),w=>w.cost);
 if(!p)return c?"nouveau":"–";const v=(c-p)/p*100;return(v>0?"+":"")+num(v)+" %"}
const baseQty=(W,fam)=>sum(W.filter(w=>(UN[w.unit]||{}).fam===fam),w=>w.qty*UN[w.unit].f);
const qtyStats=W=>stat(num(baseQty(W,"m"))+" kg","d'aliments solides jetés (30 jours)")+stat(num(baseQty(W,"v"))+" L","de liquides jetés (30 jours)")+stat(num(baseQty(W,"n"))+" pièces","ou portions jetées (30 jours)");
function wasteTable(list,opts={}){
 if(!list.length)return empty("Aucun gaspillage enregistré. Utilisez « Enregistrer un gaspillage » dès qu'un produit est jeté.");

 list.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(w=>`<tr><td>${fdate(w.date)}</td>${opts.rest?`<td>${esc(rest(w.restaurant).name)}</td>`:""}<td><b>${esc(w.product)}</b></td><td>${num(w.qty)} ${esc(w.unit)}</td><td>${esc(w.reason)}</td><td>${eur(w.cost)}</td><td>${esc(uname(w.by))}</td>${opts.del?`<td><button class="btn danger sm" data-delw="${w.id}">Supprimer</button></td>`:""}</tr>`).join("")+"</tbody></table></div>"}

function infoBox(title,html,label){const f=$("#dform");f.onsubmit=e=>e.preventDefault();
 f.innerHTML=`<h2>${esc(title)}</h2>${html}<div class="acts"><button type="button" class="btn" id="fc">${esc(label||"Fermer")}</button></div>`;$("#fc").onclick=()=>$("#dlg").close();$("#dlg").showModal()}
function addPurchase(l){
 l.product=(l.product||"").trim();
 if(!l.product)return"Indiquez le produit.";
 if(!UN[l.unit])return`Unité inconnue « ${l.unit} ».`;
 if(!(l.qty>0))return"La quantité doit être supérieure à 0.";
 if(!(l.total>0))return"Le total payé doit être supérieur à 0.";
 if(!l.date||l.date>day(0))return"La date est invalide ou dans le futur.";
 if(l.exp&&!/^\d{4}-\d{2}-\d{2}$/.test(l.exp))return"Date de péremption invalide.";
 const fam=UN[l.unit].fam,up=+(l.total/(l.qty*UN[l.unit].f)).toFixed(4);
 const p=db.products.find(x=>x.restaurant===me.restaurant&&x.name.toLowerCase()===l.product.toLowerCase());
 if(p){if(FAM[p.unit]!==fam)return`« ${p.name} » est géré en ${p.unit} dans le catalogue : utilisez une unité compatible.`;p.price=up;p.qty=+((+p.qty||0)+l.qty*UN[l.unit].f/UN[p.unit].f).toFixed(3);if(l.exp)p.expiry=l.exp}
 else db.products.push({id:uid(),restaurant:me.restaurant,name:l.product,cat:CATS.includes(l.cat)?l.cat:"Autre",unit:fam==="n"?l.unit:BASEU[fam],price:up,qty:+(l.qty*UN[l.unit].f/UN[fam==="n"?l.unit:BASEU[fam]].f).toFixed(3),expiry:l.exp||""});
 db.purchases.push({id:uid(),restaurant:me.restaurant,date:l.date,supplier:l.supplier||"",product:p?p.name:l.product,qty:l.qty,unit:l.unit,total:l.total,unitPrice:up,baseUnit:p?p.unit:(fam==="n"?l.unit:BASEU[fam])});
 return null}

 (A.length?`<div class="tw"><table><thead><tr><th>Date</th><th>Fournisseur</th><th>Produit</th><th>Quantité</th><th>Total payé</th><th>Prix unitaire calculé</th><th>Action</th></tr></thead><tbody>`+
 A.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(a=>`<tr><td>${fdate(a.date)}</td><td>${esc(a.supplier||"–")}</td><td><b>${esc(a.product)}</b></td><td>${num(a.qty)} ${esc(a.unit)}</td><td>${eur(a.total)}</td><td>${pfmt(a.unitPrice)} / ${esc(a.baseUnit)}</td><td><button class="btn danger sm" data-dela="${a.id}">Supprimer</button></td></tr>`).join("")+"</tbody></table></div>":empty("Aucun achat enregistré. Cliquez sur « Ajouter un achat » pour saisir le premier."))};
function addPurchaseForm(){
 const P=db.products.filter(p=>p.restaurant===me.restaurant),f=$("#dform");
 f.innerHTML=`<h2>Ajouter un achat</h2>
 <label for="a_d">Date de la facture</label><input id="a_d" type="date" max="${day(0)}" value="${day(0)}" required>
 <label for="a_s">Fournisseur (facultatif)</label><input id="a_s" maxlength="60">
 <label for="a_p">Produit</label><input id="a_p" list="a_dl" maxlength="60" autocomplete="off" placeholder="Choisissez ou tapez un nouveau produit"><datalist id="a_dl">${P.map(p=>`<option value="${esc(p.name)}">`).join("")}</datalist>
 <label for="a_c">Catégorie (pour un nouveau produit)</label><select id="a_c">${CATS.map(c=>`<option>${esc(c)}</option>`).join("")}</select>
 <label for="a_q">Quantité achetée</label><div style="display:flex;gap:.5rem"><input id="a_q" type="number" min="0" step="any" inputmode="decimal" style="flex:1"><select id="a_u" style="flex:1" aria-label="Unité">${Object.keys(UN).map(u=>`<option ${u==="kg"?"selected":""}>${u}</option>`).join("")}</select></div>
 <label for="a_e">Date de péremption (facultatif)</label><input id="a_e" type="date">
 <label for="a_t">Total payé (€)</label><input id="a_t" type="number" min="0" step="any" inputmode="decimal">
 <p id="a_r" style="font-weight:700;margin:.6rem 0 0"></p>
 <div class="acts"><button type="button" class="btn sec" id="fc">Annuler</button><button class="btn">Enregistrer</button></div>`;
 function calc(){const q=parseFloat($("#a_q").value),t=parseFloat($("#a_t").value),u=$("#a_u").value;
  $("#a_r").textContent=(q>0&&t>0)?`Prix unitaire calculé : ${pfmt(t/(q*UN[u].f))} par ${BASEU[UN[u].fam]}`+(UN[u].f!==1?` (soit ${pfmt(t/q)} par ${u})`:""):"Prix unitaire calculé : –"}
 $("#a_p").oninput=()=>{const p=P.find(x=>x.name.toLowerCase()===$("#a_p").value.trim().toLowerCase());
  if(p&&FAM[p.unit]!==UN[$("#a_u").value].fam)$("#a_u").value=p.unit;calc()};
 ["a_q","a_t"].forEach(i=>$("#"+i).oninput=calc);$("#a_u").onchange=calc;
 $("#fc").onclick=()=>$("#dlg").close();
 f.onsubmit=e=>{e.preventDefault();
  const err=addPurchase({date:$("#a_d").value,supplier:$("#a_s").value.trim(),product:$("#a_p").value,cat:$("#a_c").value,qty:parseFloat($("#a_q").value),unit:$("#a_u").value,total:parseFloat($("#a_t").value),exp:$("#a_e").value});
  if(err){toast(err,1);return}
  const a=db.purchases[db.purchases.length-1];save();$("#dlg").close();route();toast(`Achat enregistré : ${pfmt(a.unitPrice)} par ${a.baseUnit}, catalogue mis à jour.`)};
 $("#dlg").showModal();
}

const kid=(k,r)=>k==="users"?r.email:r.id;
async function sbFetch(k){const c=TB[k],rows=[];
 for(let i=0;;i+=1000){const {data,error}=await SB.from(c.t).select("*").order("id").range(i,i+999);
  if(error)throw new Error(c.t+" : "+error.message);rows.push(...data);if(data.length<1000)break}
 return rows.map(c.from)}
function snap(k){remote[k]=new Map(db[k].map(r=>[kid(k,r),JSON.stringify(TB[k].to(r))]))}
async function sbFetchAll(){const keys=Object.keys(TB),res=await Promise.all(keys.map(sbFetch)),nd=emptyDb(),nr={};
 keys.forEach((k,i)=>{nd[k]=res[i];nr[k]=new Map(nd[k].map(r=>[kid(k,r),JSON.stringify(TB[k].to(r))]))});return{nd,nr}}
async function sbLoad(){const {nd,nr}=await sbFetchAll();db=nd;remote=nr}
/* Actualisation : récupère les changements faits ailleurs (autre appareil, autre utilisateur) sans perdre une saisie en cours */
let lastRef=0;
const dbSig=d=>JSON.stringify(Object.keys(TB).map(k=>d[k].map(r=>JSON.stringify(r)).sort()));
async function sbRefresh(force){
 if(!SB||!sbMe||syncing||dirty||$("#dlg").open)return false;
 if(!force&&Date.now()-lastRef<5000)return false;lastRef=Date.now();
 try{const id=sbMe.email,{nd,nr}=await sbFetchAll();
  if(syncing||dirty||$("#dlg").open||dbSig(nd)===dbSig(db))return false;
  db=nd;remote=nr;sbMe=db.users.find(u=>u.email===id)||sbMe;me=sbMe;route();return true}catch(e){return false}}
let syncing=null,dirty=false,touchedW=false;
function sbSync(){dirty=true;if(syncing)return syncing;
 syncing=(async()=>{try{while(dirty){dirty=false;await syncOnce()}
   if(touchedW){touchedW=false;db.products=await sbFetch("products");snap("products");route()}}
  catch(e){touchedW=false;dirty=false;toast(navigator.onLine?"Enregistrement impossible : "+e.message:"Vous êtes hors connexion : la modification n'a pas été enregistrée.",1);
   try{const id=sbMe&&sbMe.email;await sbLoad();sbMe=db.users.find(u=>u.email===id)||sbMe;route()}catch(_){}}
  finally{syncing=null}})();return syncing}
async function syncOnce(){
 for(const k of ["restaurants","products","purchases","wastes","requests"]){
  const c=TB[k],sn=remote[k],ins=[],upd=[];
  db[k].forEach(r=>{const j=JSON.stringify(c.to(r));if(!sn.has(r.id))ins.push([r,j]);else if(sn.get(r.id)!==j)upd.push([r,j])});
  if(ins.length){const {error}=await SB.from(c.t).insert(ins.map(x=>c.to(x[0])));if(error)throw new Error(error.message);ins.forEach(([r,j])=>sn.set(r.id,j));if(k==="wastes")touchedW=true}
  for(const [r,j] of upd){const {error}=await SB.from(c.t).update(c.to(r)).eq("id",r.id);if(error)throw new Error(error.message);sn.set(r.id,j)}
 }
 for(const k of ["wastes","purchases","products","requests","users","restaurants"]){
  const sn=remote[k],now=new Set(db[k].map(r=>kid(k,r))),ids=[...sn.keys()].filter(id=>!now.has(id));
  if(ids.length){const {error}=await SB.from(TB[k].t).delete().in("id",ids);if(error)throw new Error(error.message);ids.forEach(id=>sn.delete(id));if(k==="wastes")touchedW=true}
 }
}

 const {error}=await SB.from("pending_invites").upsert({email:email.toLowerCase(),role,restaurant_id:restaurant,full_name:name},{onConflict:"email"});
 toast(error?"Invitation impossible : "+error.message:"Invitation enregistrée. Dites à cette personne de cliquer sur « Créer mon compte » avec l'adresse "+email+".",!!error)}
const frErr=m=>/invalid login/i.test(m)?"E-mail ou mot de passe incorrect.":/not confirmed/i.test(m)?"Confirmez d'abord votre adresse e-mail grâce au lien reçu par e-mail.":/already registered/i.test(m)?"Un compte existe déjà avec cet e-mail : connectez-vous ou utilisez « Mot de passe oublié ».":/rate limit|too many/i.test(m)?"Trop de tentatives ou d'e-mails envoyés : réessayez dans quelques minutes.":m;
function loginMsg(t,ok){const e=$("#lerr");e.textContent=t;e.classList.remove("hidden");e.style.background=ok?"var(--g2)":"";e.style.color=ok?"var(--g)":""}
async function sbEnter(session){
 try{await sbLoad()}catch(e){await SB.auth.signOut();db=emptyDb();sbMe=null;boot();loginMsg("Chargement des données impossible : "+e.message);return}
 const u=db.users.find(x=>x.email===session.user.id);
 if(!u||(u.role!=="admin"&&!db.restaurants.some(r=>r.id===u.restaurant))){
  await SB.auth.signOut();db=emptyDb();sbMe=null;boot();
  loginMsg(u?"Ce restaurant est suspendu ou en attente de validation.":"Aucun accès n'est associé à ce compte : une invitation de l'administrateur ou de votre responsable est nécessaire.");return}
 if(u.terms!==CONSENT_VERSION){termsGate(u);return}enterApp(u)}
let blockEsc=false;
$("#dlg").addEventListener("cancel",e=>{if(blockEsc)e.preventDefault()});
function enterApp(u){sbMe=u;$("#lerr").classList.add("hidden");$("#pw").value="";location.hash="";boot()}
function termsGate(u){const f=$("#dform");blockEsc=true;
 f.innerHTML=`<h2>Conditions et confidentialité</h2><p style="color:var(--mute);font-size:.9rem">Pour continuer, lisez et acceptez ces textes (version ${CONSENT_VERSION}).</p>
 <details><summary><b>Conditions d'utilisation</b></summary>${LEGAL.cgu[1]()}</details>
 <details><summary><b>Politique de confidentialité</b></summary>${LEGAL.privacy[1]()}</details>
 <label style="display:flex;gap:.5rem;align-items:flex-start;font-weight:400;margin-top:1rem"><input type="checkbox" id="t_ok" style="width:auto;margin-top:.25rem"><span>J'ai lu et j'accepte ces conditions.</span></label>
 <div class="acts"><button type="button" class="btn sec" id="t_out">Me déconnecter</button><button class="btn">Continuer</button></div>`;
 $("#t_out").onclick=async()=>{blockEsc=false;$("#dlg").close();await SB.auth.signOut();sbMe=null;db=emptyDb();boot()};
 f.onsubmit=async e=>{e.preventDefault();if(!$("#t_ok").checked){toast("Cochez la case pour continuer.",1);return}
  const {error}=await SB.rpc("accept_terms",{v:CONSENT_VERSION});
  if(error&&!(error.code==="PGRST202"||/could not find|function/i.test(error.message||""))){toast("Enregistrement impossible : "+error.message,1);return}
  if(error)toast("Votre acceptation n'a pas pu être enregistrée. Contactez l'administrateur si le problème persiste.",1);
  u.terms=CONSENT_VERSION;blockEsc=false;$("#dlg").close();enterApp(u)};
 $("#dlg").showModal()}
function signupForm(){const f=$("#dform");
 f.innerHTML=`<h2>Créer mon compte</h2><p style="color:var(--mute);font-size:.9rem">Utilisez l'adresse e-mail à laquelle vous avez été invité(e). Sans invitation, le compte n'aura accès à aucune donnée.</p>
 <label for="s_e">E-mail</label><input id="s_e" type="email" required autocomplete="username">
 <label for="s_p">Mot de passe (8 caractères minimum)</label><input id="s_p" type="password" required autocomplete="new-password">
 <label for="s_q">Confirmer le mot de passe</label><input id="s_q" type="password" required autocomplete="new-password">
 <small style="color:var(--mute)">Les conditions d'utilisation et la politique de confidentialité vous seront présentées à la première connexion ; vous devrez les accepter pour continuer.</small>
 <div class="acts"><button type="button" class="btn sec" id="fc">Annuler</button><button class="btn">Créer mon compte</button></div>`;
 $("#fc").onclick=()=>$("#dlg").close();
 f.onsubmit=async e=>{e.preventDefault();const p=$("#s_p").value;
  if(p.length<8){toast("Le mot de passe doit contenir au moins 8 caractères.",1);return}
  if(p!==$("#s_q").value){toast("Les deux mots de passe ne correspondent pas.",1);return}
  const {data,error}=await SB.auth.signUp({email:$("#s_e").value.trim(),password:p,options:{emailRedirectTo:location.origin+location.pathname}});
  if(error){toast(frErr(error.message),1);return}
  $("#dlg").close();
  if(data.session)await sbEnter(data.session);
  else infoBox("Vérifiez votre boîte mail","<p>Un e-mail de confirmation vous a été envoyé. Cliquez sur le lien, puis revenez vous connecter ici. Pensez à regarder les courriers indésirables.</p>")};
 $("#dlg").showModal()}
function forgotForm(){const f=$("#dform");
 f.innerHTML=`<h2>Mot de passe oublié</h2><label for="o_e">Votre adresse e-mail</label><input id="o_e" type="email" required value="${esc($("#em").value)}">
 <div class="acts"><button type="button" class="btn sec" id="fc">Annuler</button><button class="btn">Envoyer le lien</button></div>`;
 $("#fc").onclick=()=>$("#dlg").close();
 f.onsubmit=async e=>{e.preventDefault();
  const {error}=await SB.auth.resetPasswordForEmail($("#o_e").value.trim(),{redirectTo:location.origin+location.pathname});
  $("#dlg").close();toast(error?frErr(error.message):"Si cette adresse a un compte, un e-mail de réinitialisation vient d'être envoyé.",!!error)};
 $("#dlg").showModal()}
function newPasswordForm(){const f=$("#dform");
 f.innerHTML=`<h2>Nouveau mot de passe</h2><label for="n_p">Nouveau mot de passe (8 caractères minimum)</label><input id="n_p" type="password" required autocomplete="new-password">
 <div class="acts"><button class="btn">Enregistrer</button></div>`;
 f.onsubmit=async e=>{e.preventDefault();const p=$("#n_p").value;if(p.length<8){toast("8 caractères minimum.",1);return}
  const {error}=await SB.auth.updateUser({password:p});if(error){toast(frErr(error.message),1);return}
  $("#dlg").close();toast("Mot de passe modifié.")};
 $("#dlg").showModal()}
async function sbInit(){
 db=emptyDb();
 $(".demo").classList.add("hidden");$("#sbLinks").classList.remove("hidden");$("#em").autocomplete="username";$("#pw").autocomplete="current-password";
 SB.auth.onAuthStateChange(ev=>{if(ev==="PASSWORD_RECOVERY")setTimeout(newPasswordForm,0)});
 $("#lform").onsubmit=async e=>{e.preventDefault();loginMsg("Connexion en cours…",true);
  const {data,error}=await SB.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
  if(error){loginMsg(frErr(error.message));return}
  await sbEnter(data.session)};
 $("#logout").onclick=async()=>{await SB.auth.signOut();sbMe=null;db=emptyDb();remote={};location.hash="";boot();toast("Vous êtes déconnecté.")};
 $("#signupBtn").onclick=signupForm;$("#forgotBtn").onclick=forgotForm;
 $("#refresh").classList.remove("hidden");$("#refresh").onclick=async()=>{const c=await sbRefresh(true);toast(c?"Données actualisées.":"Vous avez déjà les dernières données.")};
 document.addEventListener("visibilitychange",()=>{if(!document.hidden)sbRefresh()});window.addEventListener("hashchange",()=>sbRefresh(location.hash==="#/demandes"));
 const {data}=await SB.auth.getSession();
 if(data.session)await sbEnter(data.session);else boot()}
function loadLib(src){return new Promise((ok,ko)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>ko(new Error("chargement impossible : "+src));document.head.appendChild(s)})}
async function start(){
 if(CFG.supabaseUrl){
  try{
   if(!window.supabase)await loadLib("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js").catch(()=>loadLib("https://unpkg.com/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"));
   SB=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey);DEMO=false;
  }catch(e){SB=null;offlineScreen("Impossible de charger le service de données ("+e.message+"). Vérifiez votre connexion internet, puis réessayez.");return}
 }
 setBanner();
 if(SB){try{await sbInit()}catch(e){showErr("Erreur de connexion à Supabase : "+e.message);boot()}}else boot()}
start();
</script>
</body>
</html>
